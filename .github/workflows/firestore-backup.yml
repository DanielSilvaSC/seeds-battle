# Backup semanal do Firestore → backups/AAAA-MM-DD.json commitado no repositório.
# Também roda manualmente pela aba Actions (workflow_dispatch).
name: Backup Firestore
on:
  schedule:
    - cron: '0 6 * * 0' # domingo 06:00 UTC = 03:00 em Brasília
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/backup-firestore.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEEDS_BATTLE }}
      - name: Commit do backup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups
          git diff --cached --quiet || git commit -m "Backup automático do Firestore"
          git push
