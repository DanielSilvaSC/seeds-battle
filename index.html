<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171310">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Seeds Battle · Edição 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
:root{
  --soil:#171310; --soil2:#211a13; --card:#261e15; --card2:#2e2419;
  --line:#3d3122; --leaf:#8bd450; --leaf-dim:#5c9938; --gold:#f5c542;
  --cream:#f5eedf; --muted:#a4957e; --danger:#e5604c;
  --g1:#8bd450; --g2:#f2a93b;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
/* overflow-x travado: nada pode arrastar a página de lado (menu fixo fica de fato fixo) */
html,body{overflow-x:hidden;overflow-x:clip}
body{background:var(--soil);color:var(--cream);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 50% -200px,#2a2115 0%,var(--soil) 60%)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 90px}
.display{font-family:'Bungee',system-ui,sans-serif;font-weight:400;letter-spacing:.5px}

/* header */
header{text-align:center;padding:18px 0 10px}
.logo{font-size:clamp(30px,8vw,44px);line-height:1;color:var(--cream)}
.logo .b{color:var(--leaf)}
.tagline{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.dates{color:var(--muted);font-size:12px;margin-top:4px;font-weight:700}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;background:#1d1710;border-top:1px solid var(--line);
  z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.histscroll{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 2px;overscroll-behavior:contain}
.tab{appearance:none;background:none;border:none;color:var(--muted);font-family:'Nunito';font-weight:800;
  font-size:11px;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.tab .ic{font-size:20px;line-height:1}
.tab.on{color:var(--leaf)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:8px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5}

/* battle hero */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-top:14px}
.gcard{position:relative;border-radius:var(--r);padding:14px 12px;text-align:center;border:1px solid var(--line);background:var(--card)}
.gcard.lead{box-shadow:0 0 0 1px var(--gold),0 6px 24px -8px rgba(245,197,66,.35);animation:leadPulse 2.4s ease-in-out infinite}
.gseed{font-size:34px;line-height:1}
.gname{font-weight:900;font-size:15px;margin-top:6px;word-break:break-word}
.gpts{font-family:'Bungee';font-size:26px;margin-top:4px}
.gsub{color:var(--muted);font-size:11px;font-weight:700;margin-top:2px}
.vsmid{display:flex;align-items:center;justify-content:center}
.vsbadge{font-family:'Bungee';color:var(--soil);background:var(--gold);border-radius:10px;padding:8px 9px;font-size:15px}
.duel{position:relative;margin-top:14px;background:var(--soil2);border:1px solid var(--line);border-radius:999px;height:22px;
  overflow:hidden;display:flex}
.duel>div{height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.duel .d1{background:linear-gradient(90deg,var(--g1),#a8e878)}
.duel .d2{background:linear-gradient(90deg,#ffc86b,var(--g2));margin-left:auto}
.duel .seam{position:absolute;top:0;bottom:0;left:var(--w1,50%);width:2px;transform:translateX(-1px);
  background:rgba(255,255,255,.92);box-shadow:0 0 8px 2px var(--gold);opacity:.7;
  transition:left .8s cubic-bezier(.2,.8,.2,1);animation:seamGlow 2s ease-in-out infinite}
@keyframes seamGlow{0%,100%{opacity:.45}50%{opacity:.9}}
/* aba Grupos — pulso do líder, entrada em cascata e partículas */
@keyframes leadPulse{
  0%,100%{box-shadow:0 0 0 1px var(--gold),0 6px 20px -10px rgba(245,197,66,.4)}
  50%{box-shadow:0 0 0 1px var(--gold),0 10px 30px -6px rgba(245,197,66,.7)}}
@keyframes gPop{0%{opacity:0;transform:translateY(24px) scale(.8)}60%{opacity:1;transform:translateY(-5px) scale(1.05)}100%{opacity:1;transform:none}}
@keyframes gFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gEnter .gcard,.gEnter .vsmid{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.gEnter .vs .gcard:nth-child(1){animation-delay:.04s}
.gEnter .vs .vsmid{animation-delay:.16s}
.gEnter .vs .gcard:nth-child(3){animation-delay:.28s}
.gEnter .duel{animation:gFade .5s ease .34s both}
.gEnter .pill{animation:gFade .4s ease both;animation-delay:calc(var(--i,0)*28ms + .12s)}
/* aba Seeds — entrada em cascata + brilho da medalha */
.iEnter .pod{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.iEnter .podium .pod:nth-child(1){animation-delay:.1s}
.iEnter .podium .pod:nth-child(2){animation-delay:0s}
.iEnter .podium .pod:nth-child(3){animation-delay:.16s}
.iEnter .rrow{animation:gFade .4s ease both;animation-delay:calc(var(--i,0)*45ms + .1s)}
.pod.p1 .medal{display:inline-block;animation:medalShine 2.6s ease-in-out infinite}
@keyframes medalShine{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
.leadfx{position:absolute;inset:0;pointer-events:none;z-index:3}
.leadfx span{position:absolute;left:50%;top:40%;width:7px;height:7px;border-radius:99px;
  background:var(--gold);box-shadow:0 0 6px var(--gold);opacity:0;animation:leadSpark .8s ease-out forwards}
@keyframes leadSpark{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
/* fundos temáticos por aba */
.gwrap,.iwrap,.twrap,.lwrap{position:relative}
.gwrap>*,.iwrap>*,.twrap>*,.lwrap>*{position:relative;z-index:1}
/* width explícita: sem ela o SVG usa a largura intrínseca do viewBox (400px) e vaza da tela */
.tabbg{position:absolute;top:-14px;left:-14px;width:calc(100% + 28px);height:300px;z-index:0;pointer-events:none;
  opacity:.5;-webkit-mask-image:linear-gradient(#000 52%,transparent);mask-image:linear-gradient(#000 52%,transparent)}
.gbg .bg-path{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round}
.gbg .bg-soil{fill:var(--soil2)}
.gbg .bg-furrow path{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.gbg .bg-sprout path{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.gbg .bg-sprout>g{transform-box:fill-box;transform-origin:bottom center;animation:bgSway 6s ease-in-out infinite}
.gbg .bg-sprout>g:nth-child(2){animation-duration:7.5s;animation-delay:-2s}
.gbg .bg-sprout>g:nth-child(3){animation-duration:5.5s;animation-delay:-1s}
.gbg .bg-seeds circle{fill:var(--leaf-dim);animation:bgFloat 7s ease-in-out infinite}
.gbg .bg-seeds circle:nth-child(2n){animation-duration:9s}
.gbg .bg-seeds circle:nth-child(3n){animation-duration:6s;animation-delay:-2s}
@keyframes bgSpin{to{transform:rotate(360deg)}}
@keyframes bgSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bgFloat{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-6px);opacity:1}}
/* fundo aba Seeds */
.seedsbg .sb-leaf{fill:var(--leaf);opacity:.16}
.seedsbg .sb-vein{fill:none;stroke:var(--leaf-dim);stroke-width:2;opacity:.4}
.seedsbg .stalk{fill:none;stroke:var(--leaf-dim);stroke-width:3;stroke-linecap:round}
.seedsbg .lf{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.seedsbg .sb-plants>g{transform-box:fill-box;transform-origin:bottom center;animation:bgSway 6s ease-in-out infinite}
.seedsbg .sb-plants>g:nth-child(2){animation-duration:7s;animation-delay:-1s}
.seedsbg .sb-plants>g:nth-child(3){animation-duration:5.5s;animation-delay:-2s}
.seedsbg .sb-plants>g:nth-child(4){animation-duration:6.5s;animation-delay:-.5s}
.seedsbg .sb-plants>g:nth-child(5){animation-duration:7.5s;animation-delay:-3s}
/* fundo aba Tabela */
.tablebg .tb-rays path{fill:var(--gold);opacity:.1}
.tablebg .tb-rays{animation:tbGlow 5s ease-in-out infinite}
.tablebg .pg{fill:var(--card2);stroke:var(--line);stroke-width:2}
.tablebg .spine{fill:none;stroke:var(--gold);stroke-width:2}
.tablebg .tb-lines path{stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.5}
.tablebg .tb-spark{fill:var(--gold);animation:bgFloat 4s ease-in-out infinite}
/* fundo aba Líder */
.leaderbg .lb-rays path{fill:var(--gold);opacity:.1}
.leaderbg .lb-rays{animation:tbGlow 5s ease-in-out infinite}
.leaderbg .sh{fill:none;stroke:var(--gold);stroke-width:3;opacity:.6}
.leaderbg .sh-in{fill:var(--card2);stroke:var(--line);stroke-width:2}
.leaderbg .sh-leaf{fill:var(--leaf);opacity:.7}
.leaderbg .lb-shield{transform-box:fill-box;transform-origin:center;animation:shieldPulse 3.5s ease-in-out infinite}
@keyframes tbGlow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes shieldPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* ===== backdrop global animado (todas as abas) ===== */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wrap{position:relative;z-index:1}
.fx-glow{position:absolute;border-radius:50%;filter:blur(64px);opacity:.2}
.fx-glow.g-leaf{width:340px;height:340px;background:var(--leaf);left:-90px;top:8%;animation:fxDrift1 18s ease-in-out infinite}
.fx-glow.g-gold{width:300px;height:300px;background:var(--gold);right:-80px;top:42%;animation:fxDrift2 22s ease-in-out infinite}
.fx-glow.g-leaf2{width:260px;height:260px;background:var(--leaf-dim);left:30%;bottom:-100px;animation:fxDrift1 26s ease-in-out infinite reverse}
@keyframes fxDrift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.15)}}
@keyframes fxDrift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-30px) scale(1.12)}}
.fx-p{position:absolute;bottom:-40px;opacity:0;will-change:transform,opacity;animation:fxRise linear infinite}
@keyframes fxRise{
  0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
  10%{opacity:.55}
  90%{opacity:.55}
  100%{transform:translateY(-118vh) translateX(var(--sx,0)) rotate(var(--rot,180deg));opacity:0}}
/* ===== entrada em cascata Tabela / Líder ===== */
.tEnter .card{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.tEnter details{animation:gFade .4s ease both;animation-delay:calc(var(--i,0)*55ms + .12s)}
.lEnter .card{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.lEnter .card:nth-child(2){animation-delay:.06s}
.lEnter .card:nth-child(3){animation-delay:.16s}
.lEnter .card:nth-child(4){animation-delay:.26s}
/* ===== brilho de varredura (shimmer) — cara de game ===== */
.vsbadge,.pod.p1{position:relative;overflow:hidden}
.vsbadge::after,.pod.p1::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);
  animation:sweep 3.2s ease-in-out infinite}
.pod.p1::after{animation-duration:3.8s}
@keyframes sweep{0%{left:-70%}35%{left:130%}100%{left:130%}}
/* ===== nav com feedback de game ===== */
.tab{transition:transform .12s ease}
.tab:active{transform:scale(.88)}
.tab.on .ic{animation:tabBounce 1.8s ease-in-out infinite}
@keyframes tabBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.12)}}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:800;margin-top:6px}

/* individual ranking */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:14px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-align:center;padding:12px 6px}
.pod .medal{font-size:26px}
.pod .pn{font-weight:900;font-size:13px;margin-top:4px;word-break:break-word}
.pod .pp{font-family:'Bungee';font-size:16px;color:var(--gold);margin-top:2px}
.pod.p1{padding-top:20px;box-shadow:0 0 0 1px var(--gold) inset}
.rlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.rrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;
  grid-template-columns:28px 34px 1fr auto;gap:10px;align-items:center}
.rrow .pos{font-family:'Bungee';color:var(--muted);font-size:14px}
/* evolução visual: a planta cresce com o nível, balança e brilha no topo */
.rrow .plant{text-align:center;line-height:1}
.rrow .plant span{display:inline-block;transform-origin:50% 88%;animation:plantSway 5.5s ease-in-out infinite}
.plant.lv0{font-size:17px;filter:saturate(.75)}
.plant.lv1{font-size:20px}
.plant.lv2{font-size:23px}
.plant.lv3{font-size:26px}
.plant.lv4{font-size:28px;filter:drop-shadow(0 0 6px rgba(229,96,76,.5))}
.plant.lv5{font-size:28px;filter:drop-shadow(0 0 9px rgba(245,197,66,.8))}
.plant.lv5 span{animation:crownPulse 2.4s ease-in-out infinite}
@keyframes plantSway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes crownPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.rrow .nm{font-weight:900;font-size:14px}
.rrow .lvl{color:var(--muted);font-size:11px;font-weight:800}
.rrow .pts{font-family:'Bungee';color:var(--gold);font-size:15px;text-align:right}
.xp{height:7px;border-radius:99px;background:var(--soil2);border:1px solid var(--line);margin-top:5px;overflow:hidden}
.xp>i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf-dim),var(--leaf));transition:width .6s}
/* quase subindo de nível (80%+): a barra vira ouro e pulsa */
.xp.near>i{background:linear-gradient(90deg,var(--gold),#ffe08a);animation:xpNear 1.4s ease-in-out infinite}
@keyframes xpNear{0%,100%{opacity:1}50%{opacity:.6}}
/* jardim do grupo — plantinhas dos membros no card */
.garden{margin-top:6px;font-size:15px;letter-spacing:2px;line-height:1.5;word-break:break-all}
.gdot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:1px}

/* table tab */
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ptable th{color:var(--gold);text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:8px 6px;border-bottom:1px solid var(--line)}
.ptable td{padding:7px 6px;border-bottom:1px solid #2c2318;font-weight:700}
.ptable td:last-child{text-align:right;font-family:'Bungee';font-size:12px;color:var(--cream);white-space:nowrap}
.neg td:last-child{color:var(--danger)}

/* leader panel */
.field{margin-top:12px}
label{display:block;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
/* 16px mínimo: fonte menor em input faz o iOS dar zoom ao focar, deslocando o layout e o menu fixo */
input,select,textarea{width:100%;background:var(--soil2);border:1px solid var(--line);border-radius:10px;color:var(--cream);
  font-family:'Nunito';font-weight:700;font-size:16px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);outline-offset:-1px}
.btn{appearance:none;border:none;border-radius:12px;font-family:'Nunito';font-weight:900;font-size:15px;
  padding:13px 16px;cursor:pointer;width:100%;margin-top:14px}
.btn.go{background:var(--leaf);color:#14200b}
.btn.gold{background:var(--gold);color:#241c06}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--danger);border:1px solid #5a3029}
.btn.sm{width:auto;padding:8px 12px;font-size:12.5px;margin-top:0;border-radius:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{margin-top:12px;background:var(--soil2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;
  font-size:13px;font-weight:800;color:var(--gold)}
.hrow{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px}
.hrow .t1{font-weight:900}
.hrow .t2{color:var(--muted);font-size:11.5px;font-weight:700;margin-top:2px}
.hrow .hp{font-family:'Bungee';font-size:14px}
.hrow .hp.plus{color:var(--leaf)} .hrow .hp.minus{color:var(--danger)}
.hact{display:flex;gap:8px;margin-top:8px}
.capnote{margin-top:8px;font-size:12px;font-weight:800;color:var(--gold)}
.bonusbanner{background:linear-gradient(90deg,rgba(245,197,66,.16),rgba(245,197,66,.05));border:1px solid var(--gold);
  border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:800;color:var(--gold);
  line-height:1.5;animation:bonusPulse 2.4s ease-in-out infinite}
@keyframes bonusPulse{0%,100%{box-shadow:0 0 0 0 rgba(245,197,66,.0)}50%{box-shadow:0 0 14px -2px rgba(245,197,66,.5)}}
.bonusbanner.soon{background:rgba(245,197,66,.06);border-style:dashed;border-color:rgba(245,197,66,.5);
  color:var(--muted);font-weight:700;animation:none;margin-top:8px}
.bonusbanner.soon b{color:var(--gold)}
.finalebanner{position:relative;overflow:hidden;border-radius:14px;padding:16px 18px;margin-bottom:14px;text-align:center;
  border:2px solid var(--gold);background:linear-gradient(120deg,rgba(245,197,66,.28),rgba(139,212,80,.16),rgba(245,197,66,.28));
  background-size:200% 100%;animation:finaleShine 3s linear infinite, finalePulse 1.8s ease-in-out infinite}
.finalebanner .fb-t{display:block;font-size:clamp(20px,6vw,30px);font-weight:900;line-height:1.05;color:var(--gold);
  letter-spacing:.5px;text-shadow:0 2px 10px rgba(245,197,66,.45)}
.finalebanner .fb-t .wig{display:inline-block;animation:finaleWig 1.2s ease-in-out infinite}
.finalebanner .fb-s{display:block;margin-top:6px;font-size:clamp(12px,3.5vw,15px);font-weight:800;color:var(--cream);letter-spacing:1px;text-transform:uppercase}
.finalebanner .fb-em{font-size:clamp(22px,6vw,32px);vertical-align:middle}
@keyframes finaleShine{0%{background-position:0% 0}100%{background-position:200% 0}}
@keyframes finalePulse{0%,100%{box-shadow:0 0 0 0 rgba(245,197,66,0)}50%{box-shadow:0 0 26px -2px rgba(245,197,66,.6)}}
@keyframes finaleWig{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.12)}}
.finalebanner.today{border-color:var(--leaf);
  background:linear-gradient(120deg,rgba(139,212,80,.3),rgba(245,197,66,.22),rgba(139,212,80,.3));
  background-size:200% 100%;animation:finaleShine 2s linear infinite, finalePulse 1.1s ease-in-out infinite}
.finalebanner.today .fb-t{color:var(--leaf);text-shadow:0 2px 12px rgba(139,212,80,.55)}
.finalebanner.today .fb-t .wig{animation:finaleWig .7s ease-in-out infinite}
.mvpcard{background:linear-gradient(90deg,rgba(139,212,80,.18),rgba(139,212,80,.04));border:1px solid var(--leaf);
  border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13.5px;color:var(--cream);font-weight:700}
.mvpcard b{color:var(--leaf)} .mvpcard span{color:var(--muted);font-weight:800;font-size:12px}
.rrow.mvpseed{box-shadow:inset 4px 0 0 var(--leaf)}
.mvptag{margin-left:5px;font-size:12.5px;vertical-align:middle;filter:drop-shadow(0 0 4px rgba(245,197,66,.6))}
.ptabs{display:flex;gap:6px;margin:12px 0}
.ptab{flex:1;padding:11px 6px;border:1px solid var(--line);background:var(--card2);color:var(--muted);
  border-radius:10px;font-weight:800;font-size:13px;cursor:pointer;transition:.18s;font-family:inherit}
.ptab:hover{border-color:var(--leaf-dim)}
.ptab.on{background:var(--leaf);color:var(--soil);border-color:var(--leaf)}
.ptc{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:99px;background:var(--gold);
  color:var(--soil);font-size:10.5px;font-weight:900;line-height:16px;text-align:center;vertical-align:middle}
.ptab.on .ptc{background:var(--soil);color:var(--leaf)}
.streak{display:inline-block;margin-left:6px;font-size:11.5px;font-weight:900;color:#ff8a3d;vertical-align:middle}
.nm .ttl{font-size:11.5px;font-weight:800;color:var(--gold);letter-spacing:.2px;white-space:nowrap}
#overtakefx{position:fixed;inset:0;z-index:190;pointer-events:none;display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity .25s}
#overtakefx.show{opacity:1}
#overtakefx .otmsg{font-family:'Bungee',system-ui;font-size:clamp(22px,7vw,40px);color:var(--gold);text-align:center;
  text-shadow:0 4px 24px rgba(0,0,0,.6);animation:otPop .5s cubic-bezier(.2,1.4,.4,1) both}
#overtakefx .otmsg span{display:block;font-family:'Nunito',sans-serif;font-size:clamp(13px,3.5vw,18px);color:var(--cream);margin-top:8px;font-weight:900}
@keyframes otPop{0%{transform:scale(.4) rotate(-6deg);opacity:0}60%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.mission{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-top:10px}
.mission.on{border-color:var(--leaf);box-shadow:0 0 0 1px rgba(139,212,80,.3)}
.mission .mtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13.5px;color:var(--cream)}
.mission .mend{font-size:11px;font-weight:800;color:var(--muted)}
.mission .mdone{font-size:11px;font-weight:900;color:var(--leaf)}
.mbar{height:9px;background:var(--soil2);border-radius:99px;overflow:hidden;margin:7px 0 4px}
.mbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf-dim),var(--leaf));border-radius:99px;transition:width .6s ease}
.mission .mmeta{font-size:11.5px;font-weight:700;color:var(--muted)}
.mission .mgrp{display:flex;align-items:center;gap:6px;margin-top:6px}
.mission .mgrp .mgn{font-size:12px;font-weight:800;min-width:64px}
.mission .mgrp .mbar{flex:1;margin:0}
.mission .mreward{margin-top:7px;font-size:12.5px;font-weight:800;color:var(--gold)}
.passrow{margin-top:6px}.passrow+.passrow{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
.passlbl{font-size:12.5px;font-weight:900;margin-bottom:8px}
.passtrack{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.ptier{flex:0 0 auto;width:88px;text-align:center;opacity:.5;transition:.3s}
.ptier.on{opacity:1}
.ptier .pnode{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:0 auto 4px;border-radius:50%;
  background:var(--soil2);border:2px solid var(--line);font-weight:900;font-size:13px;color:var(--muted)}
.ptier.on .pnode{background:var(--gold);border-color:var(--gold);color:var(--soil)}
.ptier .plbl{display:block;font-size:11px;font-weight:900;color:var(--cream)}
.ptier .prw{display:block;font-size:10.5px;font-weight:700;color:var(--muted);line-height:1.25;margin-top:2px}
.ptier.on .prw{color:var(--gold)}
.bosscard{border-color:#c0603c}
.bosscard.beat{border-color:var(--leaf);box-shadow:0 0 0 1px rgba(139,212,80,.35)}
.bosscard .bosslbl{font-size:15px;font-weight:900;color:var(--cream);margin-bottom:8px}
.tl-roulette{margin:8px auto;font-family:'Bungee',system-ui;font-size:clamp(16px,4vw,26px);color:var(--gold);text-align:center}
.tl-roulette.hot{color:var(--leaf);animation:bonusPulse 1.2s ease-in-out infinite}
.pill{display:inline-block;background:var(--soil2);border:1px solid var(--line);border-radius:99px;
  padding:3px 10px;font-size:11px;font-weight:800;color:var(--muted);margin:3px 3px 0 0}
.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.who .wn{font-weight:900;color:var(--leaf);font-size:13px}

/* toast + misc */
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--gold);color:#241c06;font-weight:900;font-size:14px;padding:11px 18px;border-radius:12px;
  transition:.25s;z-index:99;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mutebtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:60;width:38px;height:38px;
  border-radius:50%;border:1px solid var(--line);background:#1d1710cc;color:var(--cream);font-size:17px;line-height:1;
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .12s ease}
.mutebtn:active{transform:scale(.88)}
.mutebtn.off{opacity:.45}
.mutebtn.m2{right:56px}
.loading{text-align:center;padding:60px 0;color:var(--muted);font-weight:800}
.seedspin{font-size:40px;display:inline-block;animation:grow 1.2s ease-in-out infinite alternate}
@keyframes grow{from{transform:scale(.85) rotate(-6deg)}to{transform:scale(1.1) rotate(6deg)}}
.view{display:none}.view.on{display:block}
details{margin-top:10px}
summary{cursor:pointer;font-weight:900;font-size:13px;color:var(--cream);padding:6px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.gpts{font-size:21px}.vsbadge{font-size:13px}}

/* banco de perguntas (só líder) */
.qrow.used{opacity:.5}
.qrow.used .qq{text-decoration:line-through;text-decoration-color:var(--leaf-dim)}
.qq{font-weight:800;font-size:13px;line-height:1.45}
.qq b{color:var(--gold)}
.qbadge{display:inline-block;background:var(--leaf);color:#14200b;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px;white-space:nowrap}
.qansd{margin-top:8px}
.qansd summary{font-size:12px;color:var(--muted);font-weight:800}
.qans{color:var(--leaf);font-weight:800;font-size:13px;line-height:1.5;margin-top:4px}
.qref{color:var(--muted);font-size:11px;font-weight:700;margin-top:3px}
.qsecmeta{color:var(--muted);font-weight:800;font-size:11px}

/* ===== countdown ===== */
.countdown{margin-top:6px;font-size:12px;font-weight:900;color:var(--leaf);letter-spacing:1px}
.countdown.urgent{color:var(--gold);animation:cdPulse 1.6s ease-in-out infinite}
.countdown.over{color:var(--muted)}
@keyframes cdPulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ===== feed ao vivo ===== */
.feedrow{display:flex;justify-content:space-between;gap:8px;align-items:center;background:var(--card2);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:7px;font-size:12.5px;animation:gFade .4s ease both}
.feedrow .fw{font-weight:900}
.feedrow .ft{color:var(--muted);font-size:11px;font-weight:700}
.feedrow .fp{font-family:'Bungee';font-size:13px;white-space:nowrap}
.feedrow .fp.plus{color:var(--leaf)}.feedrow .fp.minus{color:var(--danger)}

/* ===== conquistas (badges) ===== */
.bdg{display:inline-block;font-size:13px;margin-left:3px;cursor:default}
.bdgrow{display:flex;gap:10px;align-items:flex-start;background:var(--soil2);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;margin-top:6px}
.bdgrow .be{font-size:20px;line-height:1.2;flex:none}
.bdgrow b{font-size:12.5px}
.bdgrow .bd{color:var(--muted);font-size:11px;font-weight:700;margin-top:1px;line-height:1.4}
.bdgrow.off{opacity:.4;filter:grayscale(1)}

/* ===== scrollbars no tema (histórico, modais, telão, textareas) ===== */
*{scrollbar-width:thin;scrollbar-color:var(--leaf-dim) var(--soil2)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--soil2);border-radius:99px}
::-webkit-scrollbar-thumb{background:var(--leaf-dim);border-radius:99px;border:2px solid var(--soil2)}
::-webkit-scrollbar-thumb:active,::-webkit-scrollbar-thumb:hover{background:var(--leaf)}
::-webkit-scrollbar-corner{background:var(--soil2)}

/* ===== gráfico corrida de pontos ===== */
.race{margin-top:6px}
.race svg{width:100%;height:auto;display:block}

/* ===== confete de subida de nível ===== */
#lvlfx{position:fixed;inset:0;pointer-events:none;z-index:180;overflow:hidden}
#lvlfx span{position:absolute;top:-30px;font-size:18px;animation:cfFall linear forwards}
@keyframes cfFall{to{transform:translateY(112vh) rotate(var(--rot,360deg))}}

/* ===== toast com ação (desfazer) ===== */
#toast.act{pointer-events:auto}
#toast .tbtn{appearance:none;border:none;background:#241c06;color:var(--gold);font-family:'Nunito';
  font-weight:900;font-size:13px;border-radius:8px;padding:6px 12px;margin-left:10px;cursor:pointer;vertical-align:middle}

/* ===== chamada em lote ===== */
.chkgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.chk{display:flex;align-items:center;gap:8px;background:var(--soil2);border:1px solid var(--line);
  border-radius:10px;padding:8px 10px;font-size:13px;font-weight:800;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--leaf);margin:0;flex:none}

/* ===== modo telão ===== */
#telao{position:fixed;inset:0;z-index:150;background:var(--soil);
  background-image:radial-gradient(1200px 600px at 50% -200px,#2a2115 0%,var(--soil) 60%);
  overflow-y:auto;padding:28px 20px 40px;display:none}
#telao.on{display:block}
.tl-in{max-width:900px;margin:0 auto;text-align:center}
.tl-logo{font-size:clamp(34px,6vw,60px);color:var(--cream)}
.tl-logo .b{color:var(--leaf)}
.tl-count{color:var(--gold);font-weight:900;font-size:clamp(13px,2vw,18px);margin-top:6px;letter-spacing:1px}
.tl-vs{display:grid;grid-template-columns:1fr auto 1fr;gap:18px;align-items:center;margin-top:26px}
.tl-g{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 14px}
.tl-g.lead{box-shadow:0 0 0 2px var(--gold),0 10px 40px -8px rgba(245,197,66,.5)}
.tl-g .e{font-size:clamp(40px,7vw,64px)}
.tl-g .n{font-weight:900;font-size:clamp(16px,3vw,26px);margin-top:8px}
.tl-g .p{font-family:'Bungee';font-size:clamp(34px,7vw,64px);margin-top:6px;color:var(--cream)}
.tl-vsb{font-family:'Bungee';color:var(--soil);background:var(--gold);border-radius:14px;padding:12px 14px;font-size:clamp(16px,3vw,26px)}
.tl-duel{margin-top:22px;height:30px}
.tl-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:22px;align-items:center}
.tl-btns .btn{width:auto;margin-top:0}
.tl-btns select{width:auto;min-width:170px}
.tl-close{position:fixed;top:14px;right:14px;z-index:160;width:auto;margin:0}
.tl-quiz{background:var(--card);border:1px solid var(--gold);border-radius:20px;padding:26px 20px;margin-top:26px;text-align:center}
.tl-qtag{display:inline-block;background:var(--gold);color:#241c06;font-weight:900;border-radius:99px;padding:4px 14px;font-size:13px}
.tl-qq{font-size:clamp(18px,3.4vw,30px);font-weight:900;line-height:1.4;margin-top:16px}
.tl-timer{font-family:'Bungee';font-size:clamp(30px,6vw,52px);margin-top:14px;color:var(--leaf)}
.tl-timer.low{color:var(--danger);animation:cdPulse .8s ease-in-out infinite}
.tl-ans{margin-top:16px;font-size:clamp(15px,2.6vw,22px);color:var(--leaf);font-weight:800;line-height:1.5}
.tl-ref{color:var(--muted);font-size:13px;font-weight:700;margin-top:6px}
.tl-opts{margin-top:16px;display:grid;gap:10px;text-align:left}
.tl-opt{display:flex;gap:12px;align-items:center;background:var(--soil);border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;font-size:clamp(14px,2.4vw,20px);font-weight:800;line-height:1.35;transition:.3s}
.tl-opt .ol{flex:none;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#241c06;font-family:'Bungee';
  display:flex;align-items:center;justify-content:center;font-size:15px}
.tl-opt.correct{border-color:var(--leaf);background:rgba(139,212,80,.16);box-shadow:0 0 14px -3px rgba(139,212,80,.5)}
.tl-opt.correct .ol{background:var(--leaf);color:#0e1c07}
.tl-opt.correct::after{content:'✅';margin-left:auto;font-size:20px}
.tl-vftag{margin-top:16px;font-family:'Bungee';color:var(--gold);font-size:clamp(15px,3vw,24px)}
.tl-opts.vf{grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
.tl-opt.tlvf{justify-content:center;font-size:clamp(16px,3vw,24px)}
.tl-opt.tv .ol{background:var(--leaf);color:#0e1c07}
.tl-opt.tf .ol{background:var(--danger);color:#2a0d08}
@media(max-width:460px){.tl-opts.vf{grid-template-columns:1fr}}
/* ===== animações do telão ===== */
@keyframes tlIn{0%{opacity:0;transform:translateY(22px) scale(.95)}100%{opacity:1;transform:none}}
@keyframes tlGlow{0%,100%{box-shadow:0 0 0 0 rgba(245,197,66,0)}50%{box-shadow:0 0 34px -6px rgba(245,197,66,.55)}}
@keyframes tlPop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes tlOptIn{0%{opacity:0;transform:translateX(-14px)}100%{opacity:1;transform:none}}
@keyframes tlCorrect{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes tlBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.tl-quiz{animation:tlIn .5s cubic-bezier(.2,.9,.25,1)}
.tl-quiz.asking{animation:tlIn .5s cubic-bezier(.2,.9,.25,1), tlGlow 2.2s ease-in-out .5s infinite}
.tl-quiz .tl-qtag{animation:tlPop .5s ease}
.tl-quiz .tl-qq{animation:tlIn .5s ease .08s backwards}
.tl-quiz .tl-timer{animation:tlBeat 1s ease-in-out infinite}
.tl-quiz .tl-timer.low{animation:cdPulse .8s ease-in-out infinite}
.tl-opts .tl-opt{animation:tlOptIn .45s ease backwards}
.tl-opts .tl-opt:nth-child(1){animation-delay:.10s}
.tl-opts .tl-opt:nth-child(2){animation-delay:.18s}
.tl-opts .tl-opt:nth-child(3){animation-delay:.26s}
.tl-opts .tl-opt:nth-child(4){animation-delay:.34s}
.tl-opt.correct{animation:tlCorrect .55s ease}
.qopts{font-size:13px;line-height:1.7;color:var(--cream);margin-bottom:6px}
/* ===== gincana ao vivo ===== */
.livebanner{background:linear-gradient(90deg,rgba(229,96,76,.22),rgba(229,96,76,.06));border:1px solid var(--danger);
  border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;font-weight:800;color:var(--danger);
  text-align:center;animation:bonusPulse 1.6s ease-in-out infinite}
.livelock{background:var(--card);border:1px solid var(--gold);border-radius:22px;padding:44px 24px 40px;text-align:center;
  margin-top:10px;animation:tlIn .5s cubic-bezier(.2,.9,.25,1)}
.ll-seal{font-size:clamp(64px,17vw,120px);line-height:1;animation:tlBeat 2s ease-in-out infinite}
.ll-t{font-family:'Bungee';color:var(--gold);font-size:clamp(22px,6vw,40px);margin-top:8px}
.ll-s{color:var(--cream);font-weight:700;font-size:clamp(14px,3vw,18px);margin:12px auto 0;max-width:480px;line-height:1.5}
.ll-tv{color:var(--leaf);font-weight:900;font-size:clamp(16px,4vw,24px);margin-top:20px}
.ll-ed{color:var(--muted);font-weight:800;font-size:12px;margin-top:16px;text-transform:uppercase;letter-spacing:1px}
/* ===== edição encerrada + hall da fama em destaque ===== */
.closedbanner{background:linear-gradient(90deg,rgba(245,197,66,.28),rgba(245,197,66,.08));border:1px solid var(--gold);
  border-radius:14px;padding:12px 16px;margin-bottom:12px;text-align:center;color:var(--gold);font-weight:800;font-size:15px;
  animation:bonusPulse 2.2s ease-in-out infinite}
.closedbanner b{font-size:1.05em}
.closedbanner span{display:block;color:var(--cream);font-weight:700;font-size:12.5px;margin-top:2px}
.hallcard{border-color:var(--gold);background:linear-gradient(180deg,rgba(245,197,66,.10),transparent 60%)}
.hall-top{text-align:center;padding:6px 0 4px}
.hall-crown{font-size:clamp(40px,9vw,64px);line-height:1;animation:tlBeat 2.4s ease-in-out infinite}
.hall-ed{font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:12px;margin-top:2px}
.hall-champ{font-family:'Bungee';color:var(--gold);font-size:clamp(18px,4.4vw,28px);margin-top:8px;line-height:1.2}
.hall-champ span,.hall-seed span{font-family:'Nunito',sans-serif;color:var(--cream);font-weight:800;font-size:.7em}
.hall-seed{color:var(--leaf);font-weight:900;font-size:clamp(15px,3.4vw,20px);margin-top:6px}
.hall-rest{margin-top:12px;border-top:1px solid var(--line);padding-top:8px}
/* painel de encerramento (topo das abas públicas) */
.closepanel{background:radial-gradient(600px 240px at 50% -60px,rgba(245,197,66,.22),transparent 70%),var(--card);
  border:2px solid var(--gold);border-radius:22px;padding:22px 18px 18px;margin-bottom:16px;text-align:center;
  box-shadow:0 12px 40px -12px rgba(245,197,66,.4);animation:tlIn .55s cubic-bezier(.2,.9,.25,1)}
.cp-crown{font-size:clamp(44px,11vw,72px);line-height:1;animation:tlBeat 2.4s ease-in-out infinite}
.cp-top{font-family:'Bungee';color:var(--gold);font-size:clamp(20px,6vw,34px);letter-spacing:1px;margin-top:4px;
  text-shadow:0 2px 12px rgba(245,197,66,.5)}
.cp-ed{color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:1px;font-size:12px;margin-top:4px}
.cp-champ{margin-top:16px;background:rgba(245,197,66,.10);border:1px solid rgba(245,197,66,.5);border-radius:16px;padding:12px}
.cp-lbl{color:var(--gold);font-weight:900;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.cp-cg{font-family:'Bungee';font-size:clamp(20px,5.2vw,32px);margin-top:6px;line-height:1.15}
.cp-cg .cp-seed{font-family:'Nunito',sans-serif}
.cp-cpts{color:var(--cream);font-weight:900;font-size:clamp(16px,3.6vw,22px);margin-top:4px}
.cp-podlbl{color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:1px;font-size:12px;margin:18px 0 8px}
.cp-pod{display:flex;flex-direction:column;gap:10px}
.cp-row{display:flex;align-items:center;gap:12px;text-align:left;background:var(--soil);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px}
.cp-row.r0{border-color:var(--gold);box-shadow:0 0 16px -4px rgba(245,197,66,.5)}
.cp-medal{font-size:clamp(26px,6vw,38px);flex:none}
.cp-info{flex:1;min-width:0}
.cp-name{font-weight:900;font-size:clamp(15px,3.4vw,20px);color:var(--cream)}
.cp-name .cp-grp{font-size:.72em;font-weight:800}
.cp-meta{color:var(--gold);font-weight:800;font-size:clamp(12px,2.8vw,15px);margin-top:2px}
.cp-badges{margin-top:5px;font-size:clamp(15px,3.4vw,20px);line-height:1.2;letter-spacing:2px}
.cp-badges.cp-nb{font-size:11px;letter-spacing:0;color:var(--muted);font-weight:700}
.cp-share{margin-top:18px}
.cp-foot{margin-top:14px;color:var(--gold);font-weight:800;font-size:12.5px;letter-spacing:.5px}
.tl-pod{margin-top:26px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:end}
.tl-pd{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 10px;opacity:.15;transition:.5s}
.tl-pd.show{opacity:1}

const BADGES=[
 {id:'fiel',      e:'📖', n:'Fiel na Palavra',    d:'Levou a Bíblia 5+ vezes',            test:t=>((t.biblia_ebd||0)+(t.biblia_culto||0))>=5},

];
function badgeTallies(){
  const T={};
  S.members.forEach(m=>T[m.id]={});
  for(const e of S.entries){
    if(!e.mid || !T[e.mid]) continue;
    const a=ACT[e.act]; if(!a) continue;
    const t=T[e.mid];
    t[e.act]=(t[e.act]||0)+e.qty;
    if(a.cap==='oferta') t.ofertaPts=(t.ofertaPts||0)+a.v*e.qty;
    if(a.cat==='oport') t.oport=(t.oport||0)+1;
  }
  return T;
}
function badgesFor(mid,T){ const t=(T||badgeTallies())[mid]||{}; return BADGES.filter(b=>b.test(t)); }

/* ============ ENGAJAMENTO ESTILO GAME (tudo derivado dos lançamentos) ============ */
/* ----- MVP da semana: Seed com mais pontos individuais nos últimos 7 dias ----- */
function daysAgoISO(days){ const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); }
function mvpWeek(){
  const since=daysAgoISO(7), acc={};
  for(const e of S.entries){
    if(!e.mid||!e.d||e.d<since) continue;
    const a=ACT[e.act]; if(!a) continue;
    if(a.s==='both'||a.s==='ind'||a.cap==='oferta') acc[e.mid]=(acc[e.mid]||0)+ePts(a,e);
  }
  let best=null,bp=0;
  for(const id in acc){ if(acc[id]>bp){ bp=acc[id]; best=id; } }
  if(!best||bp<=0) return null;
  const m=S.members.find(x=>x.id===best);
  return m?{member:m,pts:bp}:null;
}
/* ----- Ofensiva de presença (streak): semanas 7-dias consecutivas com presença ----- */
const STREAK_ACTS=['culto_sem','culto_dom','ebd'];
function weekBucket(dateStr){ return Math.floor(Date.parse(dateStr+'T12:00:00')/(7*86400000)); }
function presenceStreak(mid){
  const buckets=new Set();
  for(const e of S.entries){
    if(e.mid!==mid||!e.d||!STREAK_ACTS.includes(e.act)) continue;
    buckets.add(weekBucket(e.d));
  }
  if(!buckets.size) return 0;
  const cur=weekBucket(new Date().toISOString().slice(0,10));
  let b = buckets.has(cur)?cur : (buckets.has(cur-1)?cur-1:null);
  if(b===null) return 0;               /* ofensiva "esfriou" (>1 semana sem presença) */
  let n=0; while(buckets.has(b)){ n++; b--; }
  return n;
}
function streakTag(mid){ const n=presenceStreak(mid); return n>=2?'<span class="streak" title="'+n+' semanas seguidas de presença">🔥'+n+'</span>':''; }
/* ----- Títulos exibidos ao lado do nome (do emblema mais prestigioso conquistado) ----- */
const TITLE_BY_BADGE={fiel:'Fiel na Palavra',pescador:'Pescador de Gente',constante:'Chama Constante',teologo:'Teólogo(a)',generoso:'Coração Generoso',estrela:'Estrela do Louvor'};
const TITLE_PRESTIGE=['constante','fiel','estrela','pescador','teologo','generoso']; /* asc: último = mais raro */
function topTitle(mid,T){
  let best=null,bi=-1;
  badgesFor(mid,T).forEach(b=>{ const i=TITLE_PRESTIGE.indexOf(b.id); if(i>bi){ bi=i; best=b.id; } });
  return best?TITLE_BY_BADGE[best]:null;
}

  S = { groups:c.groups||[], members:c.members||[], leaders:c.leaders||[],
        customActs:Array.isArray(c.customActs)?c.customActs:[],
        usedQuestions:Array.isArray(c.usedQuestions)?c.usedQuestions:[],
        bonusRules:Array.isArray(c.bonusRules)?c.bonusRules:[],
        missions:Array.isArray(c.missions)?c.missions:[],
        pass:(c.pass&&Array.isArray(c.pass.tiers))?c.pass:{basis:'combined',tiers:[]},
        boss:c.boss||null,
        live:c.live||null,
        editionClosed:c.editionClosed||null,
        rosterSeeded:c.rosterSeeded||null, entries };
}

/* ============ FIREBASE (Firestore) ============ */
/* Os dados ficam agregados em POUCOS documentos, para caber na cota grátis
   mesmo com 100+ conectados (cada atualização custa 1 leitura por pessoa):
   - app/config      → grupos, seeds, líderes, atividades (leitura pública)
   - app/hall        → hall da fama, mapa por edição (leitura pública)
   - app/questions   → banco de perguntas (só liderança lê — regra do Firestore)
   - entries/AAAA-MM → lançamentos do mês, mapa id→lançamento (leitura pública)
   O id de cada lançamento embute o mês ("2026-07_ab12cd") para achar o doc. */
function fbConfigured(){ return FIREBASE_CONFIG.projectId && FIREBASE_CONFIG.projectId!=='COLE_AQUI'; }
function entryShard(id){ return id.slice(0,7); }
function newEntryId(d){
  const m=(d||new Date().toISOString().slice(0,10)).slice(0,7);
  return m+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
}
/* FieldPath: os ids têm "-" e "_", que não podem ir crus no caminho do update() */
function fp(key){ return new firebase.firestore.FieldPath(key); }
function fdel(){ return firebase.firestore.FieldValue.delete(); }
function initFirebase(){
  if(!fbConfigured()){ fbError='config'; cfg=defaultConfig(); rebuildS(); render(); return; }
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    DB=firebase.firestore(); AUTH=firebase.auth();
    AUTH.onAuthStateChanged(u=>{ currentUser=u; if(!u) logged=null; watchQuestions(u); render(); });
    DB.doc('app/config').onSnapshot(s=>{ cfg=s.data()||null; rebuildS(); render(); }, ()=>{ fbError='read'; rebuildS(); render(); });
    DB.collection('entries').onSnapshot(s=>{ entriesMap={}; s.forEach(d=>Object.assign(entriesMap,d.data())); rebuildS(); render(); }, ()=>{ fbError='read'; rebuildS(); render(); });
    /* Colheita dos Campeões (edições passadas) — leitura pública; se a regra não existir, ignora em silêncio */
    DB.doc('app/hall').onSnapshot(s=>{ hallMap=s.data()||null; render(); }, ()=>{ hallMap=null; });
  }catch(e){ fbError='init'; cfg=defaultConfig(); rebuildS(); render(); }
}
/* Banco de perguntas: só é lido quando há líder autenticado (regra .read: "auth != null").
   Ao deslogar, descarrega da memória para não sobrar nada acessível. */
function normalizeQuestions(v){
  if(Array.isArray(v)) return v.filter(Boolean);
  if(v && typeof v==='object') return Object.values(v).filter(Boolean);

}
let unsubQuestions=null;
function watchQuestions(u){
  if(!DB) return;
  if(unsubQuestions){ unsubQuestions(); unsubQuestions=null; }
  if(!u){ QUESTIONS=[]; questionsLoaded=false; return; }
  questionsLoaded=false;
  /* TESTE LOCAL: em localhost, carrega o banco do arquivo perguntas-parabolas.json
     (não lê nem grava no Firebase). Em produção, ignora e usa o Firebase normalmente. */
  if(['localhost','127.0.0.1'].includes(location.hostname)){

/* update(fp(key),obj) substitui o lançamento inteiro (set+merge deixaria campo velho para trás) */

/* ============ CÁLCULO (com tetos do regulamento) ============ */
function calc(){
  const ind={}, grp={}, stats={}, mstats={};
  S.members.forEach(m=>{ind[m.id]=0; mstats[m.id]={oficialCount:0,ebd:0,vis:0,pen:0};});
  S.groups.forEach(g=>{grp[g.id]=0;
    stats[g.id]={oficial:0,ebd:0,visnc:0,pen:0};});
  const ofertaRaw={}; S.members.forEach(m=>ofertaRaw[m.id]=0);
  const ofertaMemG={};
  for(const e of S.entries){
    const a=ACT[e.act]; if(!a) continue;
    const pts=ePts(a,e);
    if(a.cap==='oferta'){ ofertaRaw[e.mid]=(ofertaRaw[e.mid]||0)+pts; ofertaMemG[e.mid]=e.gid; continue; }
    if((a.s==='both'||a.s==='ind') && e.mid && ind[e.mid]!==undefined) ind[e.mid]+=pts;
    if((a.s==='both'||a.s==='group') && grp[e.gid]!==undefined) grp[e.gid]+=pts;
    const st=stats[e.gid];
    if(st){
      if(['pf','pm','pd','prac'].includes(e.act)&&pts>0) st.oficial+=pts;
      if(e.act==='ebd') st.ebd+=e.qty;
      if(e.act==='vis_nc') st.visnc+=e.qty;
      if(pts<0) st.pen+=Math.abs(pts);
    }
    const ms=e.mid?mstats[e.mid]:null;
    if(ms){
      if(['pf','pm','pd'].includes(e.act)) ms.oficialCount+=e.qty;
      if(e.act==='ebd') ms.ebd+=e.qty;
      if(e.act==='vis_crente'||e.act==='vis_nc') ms.vis+=e.qty;
      if(pts<0) ms.pen+=Math.abs(pts);
    }
  }
  const capNotes=[];
  for(const m of S.members){
    const raw=ofertaRaw[m.id]||0, eff=Math.min(raw,CAPS.oferta);
    if(eff>0){ ind[m.id]+=eff; const g=ofertaMemG[m.id]||m.g; if(grp[g]!==undefined) grp[g]+=eff; }
    if(raw>CAPS.oferta) capNotes.push(m.n+': ofertas '+raw+' → limitado a '+CAPS.oferta);
  }
  return {ind,grp,stats,mstats,capNotes};
}

/* ===== Desempate (item 11 do regulamento). Retorna {n, by}:
   n<0 => a fica à frente de b · by = critério que decidiu (null se foi pelo total). ===== */
function tieGroup(aId,bId,R){
  let d=R.grp[bId]-R.grp[aId]; if(d) return {n:d,by:null};
  const A=R.stats[aId],B=R.stats[bId];
  d=B.oficial-A.oficial; if(d) return {n:d,by:'Perguntas no dia oficial'};
  d=B.ebd-A.ebd;         if(d) return {n:d,by:'Presença na EBD'};
  d=B.visnc-A.visnc;     if(d) return {n:d,by:'Visitantes não crentes'};
  d=A.pen-B.pen;         if(d) return {n:d,by:'Menos penalidades'};
  return {n:0,by:'EXTRA'};
}
function tieInd(aId,bId,R){
  let d=R.ind[bId]-R.ind[aId]; if(d) return {n:d,by:null};
  const A=R.mstats[aId],B=R.mstats[bId];
  d=B.oficialCount-A.oficialCount; if(d) return {n:d,by:'Acertos no dia oficial'};
  d=B.ebd-A.ebd;                   if(d) return {n:d,by:'Presença na EBD'};
  d=B.vis-A.vis;                   if(d) return {n:d,by:'Visitantes levados'};
  d=A.pen-B.pen;                   if(d) return {n:d,by:'Menos penalidades'};
  return {n:0,by:'EXTRA'};
}
function lvlOf(p){let L=LEVELS[0];for(const l of LEVELS)if(p>=l.min)L=l;return L;}
function nextLvl(p){for(const l of LEVELS)if(p<l.min)return l;return null;}
const fmt=n=>n.toLocaleString('pt-BR');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* ===== BÔNUS: multiplicador efetivo de um lançamento (só vale p/ pontos positivos) ===== */
function eMult(en){ const m=en&&+en.mult; return (m&&m>1)?m:1; }        /* 1 quando não há bônus */
function ePts(a,en){ const b=a.v*(en.qty||1); return b>0 ? Math.round(b*eMult(en)) : b; } /* pontos já com bônus (arredondado p/ ×1.5) */
const bonusTag=en=>eMult(en)>1?' <span style="color:var(--gold);font-weight:800;font-size:.85em">⚡×'+eMult(en)+'</span>':'';
const MULTS=[1,1.5,2,3]; /* multiplicadores oferecidos */
function multField(cur){ return '<div class="field"><label>⚡ Bônus (multiplica os pontos)</label><select id="fMult">'+
  MULTS.map(x=>'<option value="'+x+'"'+(+cur===x?' selected':'')+'>'+(x===1?'Sem bônus':'×'+x)+'</option>').join('')+'</select></div>'; }

/* ===== MOTOR DE REGRAS DE BÔNUS =====
   Regra: {id, label, target:{type:'all'|'cat'|'act', id}, mult, active?, from?, until?}
   Vigência: manual (campo active) OU janela (from/until em ms). Só afeta pontos positivos. */
function bonusStatus(r){                       /* 'active' | 'scheduled' | 'ended' | 'off' */
  if(!r||!(+r.mult>1)) return 'off';
  if(r.from||r.until){
    const now=Date.now();
    if(r.from&&now<r.from) return 'scheduled';
    if(r.until&&now>r.until) return 'ended';
    return 'active';
  }
  return r.active?'active':'off';
}
function isBonusActive(r){ return bonusStatus(r)==='active'; }
function activeBonusRules(){ return (S.bonusRules||[]).filter(isBonusActive); }
function ruleMatches(r,a,actId){
  const t=r.target||{};
  if(t.type==='all') return true;
  if(t.type==='cat') return a.cat===t.id;
  if(t.type==='act') return actId===t.id;
  return false;
}
/* melhor regra ativa p/ a atividade: mais específica vence (act>cat>all); empate → maior mult */
function bonusForAct(actId){
  const a=ACT[actId]; if(!a||!(a.v>0)) return null;
  const rank=t=>t==='act'?3:t==='cat'?2:1;
  let best=null;
  for(const r of activeBonusRules()){
    if(!ruleMatches(r,a,actId)) continue;
    if(!best){ best=r; continue; }
    const rr=rank(r.target.type), rb=rank(best.target.type);
    if(rr>rb || (rr===rb && +r.mult>+best.mult)) best=r;
  }
  return best;
}
function autoMult(actId){ const r=bonusForAct(actId); return r?+r.mult:1; }
function bonusTargetLabel(t){
  t=t||{};
  if(t.type==='all') return 'todas as atividades';
  if(t.type==='cat'){ const c=CATS_ALL.find(x=>x.id===t.id); return c?c.name:t.id; }
  if(t.type==='act'){ const a=ACT[t.id]; return a?a.n:t.id; }
  return '?';
}
function fmtWhen(ms){ const d=new Date(ms); return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function localInputToMs(v){ if(!v)return 0; const t=new Date(v).getTime(); return Number.isFinite(t)?t:0; } /* datetime-local → ms */
/* opções do seletor de alvo (só atividades positivas; penalidades fora) */
function bonusTargetOptions(sel){

    o+='<option value="act:'+a.id+'"'+(sel==='act:'+a.id?' selected':'')+'>'+esc(a.n)+'</option>'; }); });
  return o+'</optgroup>';
}

/* ============ MISSÕES DA SEMANA ============
   Missão: {id, label, target:{type,id}, goal, scope:'seed'|'group'|'all', reward, from?, until?, active?}
   Janela por data (YYYY-MM-DD). Progresso é contado dos lançamentos (qty). Reutiliza ruleMatches. */
function missionStatus(ms){
  const today=new Date().toISOString().slice(0,10);
  if(ms.from||ms.until){
    if(ms.from&&today<ms.from) return 'scheduled';
    if(ms.until&&today>ms.until) return 'ended';
    return 'active';
  }
  return ms.active?'active':'off';
}
function inMissionWindow(ms,e){
  if(!e.d) return false;
  if(ms.from&&e.d<ms.from) return false;
  if(ms.until&&e.d>ms.until) return false;
  return true;
}
function missionProgress(ms){
  const goal=Math.max(1,+ms.goal||1);
  if(ms.scope==='seed'){
    const per={};
    for(const e of S.entries){ const a=ACT[e.act]; if(!a||!e.mid) continue; if(!ruleMatches(ms,a,e.act)||!inMissionWindow(ms,e)) continue; per[e.mid]=(per[e.mid]||0)+(e.qty||1); }
    const total=S.members.length, done=S.members.filter(m=>(per[m.id]||0)>=goal).length;
    return {scope:'seed', goal, done, total, pct:total?Math.round(done/total*100):0, completed:total>0&&done>=total};
  }
  if(ms.scope==='group'){
    const per={};
    for(const e of S.entries){ const a=ACT[e.act]; if(!a||!e.gid) continue; if(!ruleMatches(ms,a,e.act)||!inMissionWindow(ms,e)) continue; per[e.gid]=(per[e.gid]||0)+(e.qty||1); }
    return {scope:'group', goal, groups:S.groups.map(g=>({g,n:per[g.id]||0,pct:Math.min(100,Math.round((per[g.id]||0)/goal*100)),done:(per[g.id]||0)>=goal})), completed:S.groups.some(g=>(per[g.id]||0)>=goal)};
  }
  let n=0;
  for(const e of S.entries){ const a=ACT[e.act]; if(!a) continue; if(!ruleMatches(ms,a,e.act)||!inMissionWindow(ms,e)) continue; n+=(e.qty||1); }
  return {scope:'all', goal, n, pct:Math.min(100,Math.round(n/goal*100)), completed:n>=goal};
}
function mBar(pct){ pct=Math.min(100,Math.max(0,pct||0)); return '<div class="mbar"><i style="width:'+pct+'%"></i></div>'; }
function missionScopeLabel(sc){ return sc==='seed'?'cada Seed':sc==='group'?'por grupo':'todos juntos'; }
/* card público das missões (aba Grupos) */
function vMissions(){
  const list=(S.missions||[]).filter(ms=>missionStatus(ms)!=='off');
  if(!list.length) return '';
  let h='<div class="card"><h2>🎯 Missões</h2>';
  list.forEach(ms=>{
    const st=missionStatus(ms), pr=missionProgress(ms);
    const tag=st==='ended'?'<span class="mend">⏳ encerrada</span>':st==='scheduled'?'<span class="mend">🕒 em breve</span>':(pr.completed?'<span class="mdone">✅ concluída!</span>':'');
    h+='<div class="mission'+(pr.completed?' on':'')+'"><div class="mtop"><b>'+esc(ms.label||'Missão')+'</b>'+tag+'</div>';
    if(pr.scope==='all'){
      h+=mBar(pr.pct)+'<div class="mmeta">'+fmt(pr.n)+' / '+fmt(pr.goal)+' · todos juntos</div>';
    }else if(pr.scope==='seed'){
      h+=mBar(pr.pct)+'<div class="mmeta">'+pr.done+' de '+pr.total+' Seeds concluíram</div>';
    }else{
      pr.groups.forEach(gp=>{ h+='<div class="mgrp"><span class="gdot" style="background:'+gp.g.color+'"></span><span class="mgn">'+esc(gp.g.name)+'</span>'+mBar(gp.pct)+'<span class="mmeta">'+gp.n+'/'+pr.goal+(gp.done?' ✅':'')+'</span></div>'; });
    }
    if(ms.reward) h+='<div class="mreward">🎁 '+esc(ms.reward)+'</div>';
    if(ms.until) h+='<div class="mmeta">prazo: '+ms.until.split('-').reverse().join('/')+'</div>';
    h+='</div>';
  });
  return h+'</div>';
}

/* ============ PASSE DA EDIÇÃO (trilha de marcos com recompensas) ============
   pass = {basis:'combined'|'group', tiers:[{id, pts, reward}]} */
function passTrackHtml(pts, tiers, label, color){
  const unlocked=tiers.filter(t=>pts>=(+t.pts||0)).length;
  const next=tiers.find(t=>pts<(+t.pts||0));
  const prevPts=unlocked>0?(+tiers[unlocked-1].pts||0):0;
  const pct=next?Math.round((pts-prevPts)/(((+next.pts||0)-prevPts)||1)*100):100;
  let h='<div class="passrow"><div class="passlbl" style="color:'+color+'">'+esc(label)+' · '+fmt(pts)+' pts · nível '+unlocked+'/'+tiers.length+'</div>';
  h+='<div class="passtrack">';
  tiers.forEach((t,i)=>{ const on=pts>=(+t.pts||0);
    h+='<div class="ptier'+(on?' on':'')+'"><span class="pnode">'+(on?'★':(i+1))+'</span><span class="plbl">'+fmt(+t.pts||0)+'</span>'+(t.reward?'<span class="prw">'+esc(t.reward)+'</span>':'')+'</div>'; });
  h+='</div>';
  if(next) h+=mBar(pct)+'<div class="mmeta">faltam '+fmt((+next.pts||0)-pts)+' pts p/ desbloquear'+(next.reward?': '+esc(next.reward):'')+'</div>';
  else h+='<div class="mmeta">🏆 Passe completo!</div>';
  return h+'</div>';
}
function vPass(R){
  const pass=S.pass;
  if(!pass||!Array.isArray(pass.tiers)||!pass.tiers.length) return '';
  const tiers=[...pass.tiers].sort((a,b)=>(+a.pts||0)-(+b.pts||0));
  let h='<div class="card"><h2>🎟️ Passe da Edição</h2>';
  if((pass.basis||'combined')==='group'){
    S.groups.forEach(g=>{ h+=passTrackHtml(R.grp[g.id]||0, tiers, g.name, g.color); });
  }else{
    const total=S.groups.reduce((s,g)=>s+(R.grp[g.id]||0),0);
    h+=passTrackHtml(total, tiers, 'Temporada', 'var(--gold)');
  }
  return h+'</div>';
}

/* ============ BOSS COLETIVO (meta cooperativa dos 2 grupos) ============
   boss = {label, target:{type,id}, goal, reward, unit?, active} */
function bossProgress(){
  const b=S.boss; if(!b||!b.active) return null;
  let n=0;
  for(const e of S.entries){ const a=ACT[e.act]; if(!a) continue; if(!ruleMatches(b,a,e.act)) continue; n+=(e.qty||1); }
  const goal=Math.max(1,+b.goal||1);
  return {n, goal, pct:Math.min(100,Math.round(n/goal*100)), defeated:n>=goal, label:b.label, reward:b.reward, unit:b.unit};
}

const SFX = (()=>{
  let ctx=null, muted=false, musicOn=true, musicTimer=null, musicGain=null;
  try{ muted = localStorage.getItem('sb_muted')==='1'; }catch(e){}
  try{ const mv=localStorage.getItem('sb_music'); if(mv!==null) musicOn=(mv==='1'); }catch(e){}
  function ac(){ if(!ctx){ try{ ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ctx=null; } } return ctx; }
  function unlock(){ const c=ac(); if(c && c.state==='suspended') c.resume(); if(musicOn) startMusic(); }
  /* pluck tipo harpa/sino (fundamental + oitava suave, envelope de corda tocada) */
  function pluck(freq,start,dur,gain){
    const c=ac(); if(!c) return;
    const t0=c.currentTime+start;
    const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), g2=c.createGain();
    o.type='triangle'; o.frequency.value=freq;
    o2.type='sine'; o2.frequency.value=freq*2; g2.gain.value=.28;
    g.gain.setValueAtTime(.0001,t0);
    g.gain.linearRampToValueAtTime(gain||.16,t0+.008);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); o2.connect(g2).connect(g); g.connect(c.destination);
    o.start(t0); o2.start(t0); o.stop(t0+dur+.05); o2.stop(t0+dur+.05);
  }
  function pseq(ns,gain){ if(muted) return; unlock(); ns.forEach(n=>pluck(n.f,n.t,n.d,gain)); }
  /* ---- música de fundo estilo game (chiptune em loop: baixo + arpejo) ---- */
  const PROG=[[523.25,659.25,784],[440,523.25,659.25],[349.23,440,523.25],[392,493.88,587.33]]; /* C · Am · F · G */
  const ARP=[0,1,2,1];
  const STEP=0.125; /* 16 avos (~120 BPM) */
  let stepIx=0, nextT=0;
  function mnote(freq,time,dur,type,gain){
    const c=ac(); if(!c||!musicGain) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,time);
    g.gain.linearRampToValueAtTime(gain,time+.006);
    g.gain.exponentialRampToValueAtTime(.0001,time+dur);
    o.connect(g).connect(musicGain); o.start(time); o.stop(time+dur+.03);
  }
  function playStep(step,time){
    const ci=Math.floor(step/16)%PROG.length, pos=step%16, ch=PROG[ci];
    if(pos%4===0) mnote(ch[0]/2, time, .22, 'triangle', .5);        /* baixo no tempo */
    else if(pos%4===2) mnote(ch[0]/2, time, .12, 'triangle', .26);  /* baixo contratempo */
    if(pos%2===0){ const idx=ARP[(pos/2)%ARP.length]; mnote(ch[idx]*2, time, .13, 'square', .3); } /* arpejo */
    if(pos===0) mnote(ch[0]*4, time, .3, 'square', .2);             /* brilho no início do compasso */
  }
  function scheduler(){
    const c=ac(); if(!c) return;
    while(nextT < c.currentTime + 0.12){ playStep(stepIx, nextT); nextT+=STEP; stepIx=(stepIx+1)%64; }
  }
  function startMusic(){
    const c=ac(); if(!c||musicTimer) return;
    if(!musicGain){ musicGain=c.createGain(); musicGain.gain.value=.0001; musicGain.connect(c.destination); }
    musicGain.gain.cancelScheduledValues(c.currentTime);
    musicGain.gain.setValueAtTime(Math.max(.0001,musicGain.gain.value||.0001),c.currentTime);
    musicGain.gain.linearRampToValueAtTime(.16,c.currentTime+1.5); /* volume de fundo, baixo */
    stepIx=0; nextT=c.currentTime+0.06;
    musicTimer=setInterval(scheduler,25);
  }
  function stopMusic(){
    const c=ac();
    if(musicGain&&c){ musicGain.gain.cancelScheduledValues(c.currentTime);
      musicGain.gain.setValueAtTime(musicGain.gain.value,c.currentTime);
      musicGain.gain.linearRampToValueAtTime(.0001,c.currentTime+0.8); }
    if(musicTimer){ clearInterval(musicTimer); musicTimer=null; }
  }
  const api={
    get muted(){ return muted; },
    setMuted(m){ muted=!!m; try{ localStorage.setItem('sb_muted', muted?'1':'0'); }catch(e){} },
    toggle(){ api.setMuted(!muted); return muted; },
    unlock,
    tick(){ pseq([{f:1175,t:0,d:.12}],.07); },
    /* Seed recebe pontos: brilho ascendente (semente brotando) */
    seed(){ pseq([{f:784,t:0,d:.5},{f:880,t:.08,d:.5},{f:1047,t:.16,d:.75}],.13); },
    /* Grupo recebe pontos: sino/acorde caloroso (bênção) */
    group(){ pseq([{f:523,t:0,d:.9},{f:659,t:0,d:.9},{f:784,t:0,d:1},{f:1047,t:.06,d:1.1}],.1); },
    coin(){ pseq([{f:880,t:0,d:.35},{f:1319,t:.07,d:.55}],.13); },
    success(){ pseq([{f:523,t:0,d:.5},{f:659,t:.12,d:.5},{f:784,t:.24,d:.9}],.13); },
    penalty(){ pseq([{f:196,t:0,d:.5},{f:147,t:.14,d:.7}],.13); },
    /* liderança conquistada: arpejo triunfal de sinos */
    fanfare(){ pseq([{f:523,t:0,d:.5},{f:659,t:.1,d:.5},{f:784,t:.2,d:.6},{f:1047,t:.3,d:1},{f:1319,t:.42,d:1.1}],.12); },
    get musicOn(){ return musicOn; },
    setMusic(on){ musicOn=!!on; try{ localStorage.setItem('sb_music', musicOn?'1':'0'); }catch(e){} if(musicOn){ unlock(); startMusic(); } else stopMusic(); },
    musicToggle(){ api.setMusic(!musicOn); return musicOn; }
  };
  return api;
})();

let renderPrevView=null;
function render(){
  if(!S) rebuildS();
  rebuildCatalog();
  const app=document.getElementById('app');
  const R=calc();
  /* auto-desligar de segurança: se o líder abrir e o modo ao vivo já passou de 3h, encerra sozinho */
  if(currentUser){ const l=liveInfo();
    if(l&&l.on&&l.since&&(Date.now()-l.since)>=LIVE_MAX_MS&&!_liveOffPending){
      _liveOffPending=true; const c=currentConfig(); c.live={on:false,since:l.since};
      fbSaveConfig(c).finally(()=>{_liveOffPending=false;});
    }
  }
  const banners=vLiveBanner()+vFinaleBanner()+vBonusBanner();
  const pubTop=(isClosed()?vClosingPanel(R):'')+banners;        /* público: painel de encerramento grandão no topo */
  const bb=(isClosed()?vClosedBanner():'')+banners;             /* líder: faixa compacta (o painel fica na aba pública) */
  if(view!=='leader' && isLive() && !currentUser && !isClosed()){ app.innerHTML=vLiveLock(R); }
  else if(view==='groups'){ app.innerHTML=pubTop+vGroups(R); animateGroups(R, renderPrevView!=='groups'); }
  else if(view==='ind'){ app.innerHTML=pubTop+vInd(R); animateInd(R, renderPrevView!=='ind'); }
  else if(view==='table'){ app.innerHTML=pubTop+'<div class="twrap">'+TABLE_BG+vTable()+'</div>'; animateSimple('.twrap','tEnter', renderPrevView!=='table'); }
  else { app.innerHTML=bb+'<div class="lwrap">'+LEADER_BG+(currentUser?vPanel(R):vLogin())+'</div>'; animateSimple('.lwrap','lEnter', renderPrevView!=='leader'); }
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view));
  renderPrevView=view;
  bind();
  renderTelao(); /* se o modo telão estiver aberto, atualiza com os dados novos */
  updCountdown(); /* nome/datas da edição vêm da config — atualiza o cabeçalho */
}

/* ===== Animações da aba Grupos — estado persiste FORA do #app (innerHTML) ===== */
let gAnim={shown:{}, w1:null, lastLead:undefined}, gCountRAF={};
function prefersReduced(){ return matchMedia('(prefers-reduced-motion: reduce)').matches; }
function animCount(gid, el, from, to, dur){
  cancelAnimationFrame(gCountRAF[gid]);
  if(from===to){ el.textContent=fmt(to); return; }
  const t0=performance.now();
  const step=t=>{
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(from+(to-from)*e));
    if(p<1) gCountRAF[gid]=requestAnimationFrame(step); else el.textContent=fmt(to);
  };
  gCountRAF[gid]=requestAnimationFrame(step);
}
function spawnLeadFx(card){
  const box=document.createElement('div'); box.className='leadfx';
  for(let i=0;i<10;i++){
    const s=document.createElement('span');
    const ang=(Math.PI*2)*(i/10)+Math.random()*.5, dist=26+Math.random()*22;
    s.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
    s.style.animationDelay=(Math.random()*80|0)+'ms';
    box.appendChild(s);
  }
  card.appendChild(box);
  setTimeout(()=>box.remove(),900);
}
/* overlay dramático quando um grupo assume a liderança (estilo evento de game) */
function overtakeFx(name){
  let host=document.getElementById('overtakefx');
  if(!host){ host=document.createElement('div'); host.id='overtakefx'; document.body.appendChild(host); }
  host.innerHTML='<div class="otmsg">🚀 ULTRAPASSAGEM!<span>'+esc(name)+' assumiu a liderança!</span></div>';
  host.classList.remove('show'); void host.offsetWidth; host.classList.add('show'); confetti();
  clearTimeout(host._x); host._x=setTimeout(()=>host.classList.remove('show'),2800);
}
function animateGroups(R, isEntry){
  const RM=prefersReduced();
  const wrap=document.querySelector('.gwrap');
  if(wrap && isEntry && !RM) wrap.classList.add('gEnter');
  /* contagem dos pontos: só do 0 na entrada; senão só anima se o valor mudou */
  let gGain=false;
  document.querySelectorAll('.gpts[data-gid]').forEach(el=>{
    const gid=el.dataset.gid, to=R.grp[gid]||0, prev=gAnim.shown[gid];
    if(!isEntry && prev!==undefined && to>prev) gGain=true;
    if(RM){ el.textContent=fmt(to); gAnim.shown[gid]=to; return; }
    const from=isEntry?0:(prev===undefined?to:prev);
    animCount(gid, el, from, to, 900);
    gAnim.shown[gid]=to;
  });
  if(gGain) SFX.group();
  /* barra de duelo + seam luminoso */
  const duel=document.querySelector('.gwrap .duel'), d1=duel&&duel.querySelector('.d1'), d2=duel&&duel.querySelector('.d2');
  if(d1&&d2){
    const g1=S.groups[0], g2=S.groups[1];
    const target=Math.round((R.grp[g1.id]||0)/(((R.grp[g1.id]||0)+(R.grp[g2.id]||0))||1)*100);
    const setW=v=>{ d1.style.width=v+'%'; d2.style.width=(100-v)+'%'; duel.style.setProperty('--w1',v+'%'); };
    if(RM){ setW(target); gAnim.w1=target; }
    else{
      const start=isEntry?0:(gAnim.w1==null?target:gAnim.w1);
      setW(start);
      requestAnimationFrame(()=>requestAnimationFrame(()=>setW(target)));
      gAnim.w1=target;
    }
  }
  /* partículas quando um grupo ASSUME a liderança (mudança real, não 1ª pintura) */
  const gs=[...S.groups].sort((a,b)=>tieGroup(a.id,b.id,R).n);
  const t01=gs.length>1?tieGroup(gs[0].id,gs[1].id,R):{n:0};
  const leadId=t01.n!==0?gs[0].id:null;
  if(!RM && !isClosed() && leadId && gAnim.lastLead && gAnim.lastLead!==leadId){
    const card=document.querySelector('.gcard[data-gid="'+leadId+'"]');
    if(card) spawnLeadFx(card);
    SFX.fanfare();
    const lg=S.groups.find(g=>g.id===leadId);
    overtakeFx(lg?lg.name:'');
  }
  gAnim.lastLead=leadId;
}

/* ===== Animações da aba Seeds (mesma lógica de estado fora do #app) ===== */
let iAnim={pts:{}, xp:{}};
function animateInd(R, isEntry){
  const RM=prefersReduced();
  const wrap=document.querySelector('.iwrap');
  if(wrap && isEntry && !RM) wrap.classList.add('iEnter');
  /* contagem dos pontos (pódio + linhas). Lê o valor anterior ANTES de atualizar. */
  let iGain=false;
  document.querySelectorAll('[data-ptsmid]').forEach(el=>{
    const mid=el.dataset.ptsmid, to=R.ind[mid]||0, prev=iAnim.pts[mid];
    if(!isEntry && prev!==undefined && to>prev) iGain=true;
    if(RM){ el.textContent=fmt(to); return; }
    const from=isEntry?0:(prev===undefined?to:prev);
    animCount('i'+el.dataset.k, el, from, to, 900);
  });
  /* subida de nível: compara o nível anterior com o novo ANTES de atualizar iAnim */
  const lvlUps=[];
  S.members.forEach(m=>{
    const prev=iAnim.pts[m.id], now=R.ind[m.id]||0;
    if(!isEntry && prev!==undefined && now>prev && lvlOf(now).min>lvlOf(prev).min) lvlUps.push({m,L:lvlOf(now)});
  });
  S.members.forEach(m=>{ iAnim.pts[m.id]=R.ind[m.id]||0; });
  if(lvlUps.length && !RM){
    confetti(); SFX.fanfare();
    toast(lvlUps.map(x=>x.m.n+' virou '+x.L.e+' '+x.L.n).join(' · ')+'! 🎉');
  } else if(iGain) SFX.seed();
  /* barras de XP */
  document.querySelectorAll('.xp>i[data-xpmid]').forEach(el=>{
    const mid=el.dataset.xpmid, target=parseFloat(el.dataset.pct)||0;
    if(RM){ el.style.width=target+'%'; iAnim.xp[mid]=target; return; }
    const prev=iAnim.xp[mid];
    const start=isEntry?0:(prev===undefined?target:prev);
    el.style.width=start+'%';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.width=target+'%'; }));
    iAnim.xp[mid]=target;
  });
}

function vGroups(R){
  const gs=[...S.groups].sort((a,b)=>tieGroup(a.id,b.id,R).n);
  const top=Math.max(1,...S.groups.map(g=>R.grp[g.id]));
  const g1=S.groups[0],g2=S.groups[1];
  const tie01=(gs.length>1)?tieGroup(gs[0].id,gs[1].id,R):{n:0,by:'EXTRA'};
  const leadId=tie01.n!==0?gs[0].id:null;
  let h='<div class="gwrap">'+GROUPS_BG+'<div class="vs">';
  [g1,g2].forEach((g,i)=>{
    const leadCls=g.id===leadId?' lead':'';
    const mem=S.members.filter(m=>m.g===g.id).length;
    const garden=S.members.filter(m=>m.g===g.id)
      .sort((a,b)=>(R.ind[b.id]||0)-(R.ind[a.id]||0))
      .map(m=>'<span title="'+esc(m.n)+' · '+lvlOf(R.ind[m.id]||0).n+'">'+lvlOf(R.ind[m.id]||0).e+'</span>').join('');
    h+='<div class="gcard'+leadCls+'" data-gid="'+g.id+'" data-ghist="'+g.id+'" style="cursor:pointer" role="button" tabindex="0" title="Ver histórico de pontos de '+esc(g.name)+'"><div class="gseed">'+g.seed+'</div>'+
       '<div class="gname" style="color:'+g.color+'">'+esc(g.name)+'</div>'+
       '<div class="gpts display" data-gid="'+g.id+'">'+fmt(R.grp[g.id])+'</div>'+
       '<div class="gsub">'+mem+' seeds</div>'+
       '<div class="garden">'+garden+'</div></div>';
    if(i===0)h+='<div class="vsmid"><div class="vsbadge">VS</div></div>';
  });
  h+='</div>';

/* ===== Corrida de pontos — acumulado por dia de lançamento (SVG puro) ===== */
function vRace(){
  const g1=S.groups[0],g2=S.groups[1]; if(!g1||!g2) return '';
  const evs=S.entries.map(e=>({e,a:ACT[e.act]}))
    .filter(x=>x.a&&(x.a.s==='both'||x.a.s==='group')&&x.e.gid&&x.e.d)
    .sort((x,y)=>x.e.d.localeCompare(y.e.d)||((x.e.ts||0)-(y.e.ts||0)));
  const dates=[...new Set(evs.map(x=>x.e.d))];
  if(dates.length<2) return '';
  const byDate={}; evs.forEach(x=>{ (byDate[x.e.d]=byDate[x.e.d]||[]).push(x); });
  const acc={}, series={};
  S.groups.forEach(g=>{acc[g.id]=0;series[g.id]=[];});
  dates.forEach(d=>{
    byDate[d].forEach(x=>{ if(acc[x.e.gid]!==undefined) acc[x.e.gid]+=ePts(x.a,x.e); });
    S.groups.forEach(g=>series[g.id].push(acc[g.id]));
  });
  const W=360,H=150,P=10;
  const maxV=Math.max(1,...S.groups.map(g=>Math.max(...series[g.id])));
  const minV=Math.min(0,...S.groups.map(g=>Math.min(...series[g.id])));
  const X=i=>P+(W-2*P)*(i/(dates.length-1));
  const Y=v=>H-P-(H-2*P)*((v-minV)/((maxV-minV)||1));
  const line=g=>series[g.id].map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let h='<div class="card"><h2>📈 Corrida de pontos</h2><div class="race">';
  h+='<svg viewBox="0 0 '+W+' '+H+'" aria-hidden="true">';
  h+='<line x1="'+P+'" y1="'+Y(0).toFixed(1)+'" x2="'+(W-P)+'" y2="'+Y(0).toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>';
  [g1,g2].forEach(g=>{
    h+='<path d="'+line(g)+'" fill="none" stroke="'+g.color+'" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    const last=series[g.id][series[g.id].length-1];
    h+='<circle cx="'+X(dates.length-1).toFixed(1)+'" cy="'+Y(last).toFixed(1)+'" r="4" fill="'+g.color+'"/>';
  });
  h+='</svg></div>';
  h+='<div class="legend"><span><span class="gdot" style="background:'+g1.color+'"></span>'+esc(g1.name)+'</span>'+
     '<span>'+dates[0].split('-').reverse().join('/')+' → '+dates[dates.length-1].split('-').reverse().join('/')+'</span>'+
     '<span>'+esc(g2.name)+'<span class="gdot" style="background:'+g2.color+';margin:0 0 0 5px"></span></span></div>';
  h+='<p class="hint" style="margin-top:6px">Acumulado por dia de lançamento (sem aplicar tetos).</p></div>';
  return h;
}

/* ============ MODO TELÃO — placar gigante para projetar no culto/EBD ============ */

const QUIZ_ACT={easy:'pf', med:'pm', hard:'pd', week:'psem_ok'};
let quizTimerH=null;
function stopQuizTimer(){ if(quizTimerH){ clearInterval(quizTimerH); quizTimerH=null; } }
function openTelao(){ telaoOn=true; PR={step:0}; TQ={phase:'idle'}; renderTelao(); }

function renderTelao(){
  const el=document.getElementById('telao'); if(!el) return;

/* pódio individual com revelação dramática: 3º → 2º → 1º */
function tlPodium(R){
  if(PR.step===0) return '';
  const ms=[...S.members].sort((a,b)=>tieInd(a.id,b.id,R).n).slice(0,3);
  if(ms.length<3) return '';
  const med=['🥇','🥈','🥉'];
  const order=[ms[1],ms[0],ms[2]]; /* 2º · 1º · 3º */
  let h='<div class="tl-pod">';
  order.forEach((m,i)=>{
    const rank=i===1?0:(i===0?1:2);            /* 0 = campeão */
    const revealed=PR.step>=(3-rank);          /* passo 1 revela o 3º, passo 2 o 2º, passo 3 o 1º */
    h+='<div class="tl-pd'+(rank===0?' p1':'')+(revealed?' show':'')+'"><div class="m">'+med[rank]+'</div>'+
       '<div class="n">'+(revealed?esc(m.n):'???')+'</div><div class="p">'+(revealed?fmt(R.ind[m.id]||0):'&nbsp;')+'</div></div>';
  });
  return h+'</div>';
}

/* quiz ao vivo: pergunta gigante + timer + lançamento de pontos em 1 clique */
function tlQuiz(){
  if(TQ.phase==='idle'||!TQ.item) return '';
  const it=TQ.item, sec=TQ.sec;
  let h='<div class="tl-quiz'+(TQ.phase==='q'?' asking':' revealed')+'"><span class="tl-qtag">'+esc(sec.name)+(sec.pts?' · '+esc(sec.pts):'')+'</span>';
  h+='<div class="tl-qq">'+esc(it.q)+'</div>';
  /* alternativas: ordem embaralhada em TQ.order; a correta só destaca ao revelar.
     V/F tem visual próprio (V verde / F vermelho) e não embaralha. */
  if(Array.isArray(it.opts)&&it.opts.length&&Array.isArray(TQ.order)){
    if(it.vf){
      h+='<div class="tl-vftag">🤔 Verdadeiro ou Falso?</div>';
      h+='<div class="tl-opts vf">'+it.opts.map((o,i)=>{
        const isC=TQ.phase!=='q'&&i===it.correct, isV=/^v/i.test(o);
        return '<div class="tl-opt tlvf '+(isV?'tv':'tf')+(isC?' correct':'')+'"><span class="ol">'+(isV?'V':'F')+'</span><span>'+esc(o)+'</span></div>';
      }).join('')+'</div>';
    } else {
      const L=['A','B','C','D','E','F'];
      h+='<div class="tl-opts">'+TQ.order.map((oi,pos)=>{
        const isC=TQ.phase!=='q'&&oi===it.correct;
        return '<div class="tl-opt'+(isC?' correct':'')+'"><span class="ol">'+L[pos]+'</span><span>'+esc(it.opts[oi])+'</span></div>';
      }).join('')+'</div>';
    }
  }
  if(TQ.phase==='q'){
    h+='<div class="tl-timer'+(TQ.tleft<=5?' low':'')+'" id="tlTimer">'+(TQ.tleft>0?TQ.tleft:'⏰')+'</div>';
    h+='<div class="tl-btns"><button class="btn gold sm" id="tlReveal">👁️ Revelar resposta</button>'+
       '<button class="btn ghost sm" id="tlQCancel">Cancelar</button></div>';
  } else {
    h+='<div class="tl-ans">'+esc(it.a)+'</div><div class="tl-ref">'+esc(it.r||'')+'</div>';
    const actId=QUIZ_ACT[sec.id], a=actId?ACT[actId]:null;
    if(currentUser && a){
      const em=Math.max(autoMult(actId), TQ.rmult||1);          /* bônus efetivo (regra ativa ou roleta) */
      const val=v=>fmt(ePts({v},{qty:1,mult:em}));
      if(TQ.rmult===undefined) h+='<div class="tl-btns"><button class="btn gold sm" id="tlSpin"><span id="tlRoulette">🎡 Girar roleta de bônus</span></button></div>';
      else h+='<div class="tl-roulette'+(TQ.rmult>1?' hot':'')+'">🎡 Roleta: ×'+TQ.rmult+(TQ.rmult>1?' — bônus nesta resposta! 🔥':' (sem bônus desta vez)')+'</div>';
      if(a.s!=='group'){ /* dia oficial: quem acertou foi um Seed */
        h+='<div class="tl-btns"><select id="tlSeed">'+S.members.map(m=>{const g=S.groups.find(x=>x.id===m.g);
             return '<option value="'+m.id+'">'+esc(m.n)+' · '+esc(g?g.name:'')+'</option>';}).join('')+'</select>'+
           '<button class="btn go sm" id="tlHit">✅ Acertou (+'+val(a.v)+(em>1?' ⚡':'')+')</button></div>';
        h+='<div class="tl-btns"><select id="tlGrpT">'+S.groups.map(g=>'<option value="'+g.id+'">'+esc(g.name)+'</option>').join('')+'</select>'+
           '<button class="btn ghost sm" id="tlTry">🤏 Tentativa c/ raciocínio (+'+val(ACT['prac'].v)+')</button></div>';
      } else { /* pergunta da semana: pontua o grupo */
        h+='<div class="tl-btns"><select id="tlGrp">'+S.groups.map(g=>'<option value="'+g.id+'">'+esc(g.name)+'</option>').join('')+'</select>'+
           '<button class="btn go sm" id="tlHitG">✅ Grupo acertou (+'+val(a.v)+(em>1?' ⚡':'')+')</button>'+
           '<button class="btn ghost sm" id="tlTryG">🤏 Tentativa (+'+val(ACT['psem_tent'].v)+')</button></div>';
      }
    }
    h+='<div class="tl-btns"><button class="btn gold sm" id="tlUsed">✓ Marcar usada e fechar</button>'+
       '<button class="btn ghost sm" id="tlQClose">Fechar sem marcar</button></div>';
