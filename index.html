}

function tlPickSection(){
  const used=new Set(S.usedQuestions||[]);
  const ov=document.createElement('div');
  ov.style.cssText='position:fixed;inset:0;background:rgba(10,8,5,.82);z-index:210;display:flex;align-items:center;justify-content:center;padding:20px';
  let inner='<div style="background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:340px;width:100%;padding:20px">'+
    '<h2 style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)">Sortear de qual seção?</h2>';
  QUESTIONS.forEach(sec=>{
    if(!sec) return;
    const n=(sec.items||[]).filter(it=>it&&!used.has(it.id)).length;
    inner+='<button class="btn ghost" data-sec="'+esc(sec.id)+'"'+(n?'':' disabled style="opacity:.4"')+'>'+esc(sec.name)+' · '+n+' restante(s)</button>';
  });
  inner+='<button class="btn red" data-x>Cancelar</button></div>';
  ov.innerHTML=inner;
  document.body.appendChild(ov);
  ov.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ ov.remove(); startQuiz(b.dataset.sec); });
  ov.querySelector('[data-x]').onclick=()=>ov.remove();
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
}
function startQuiz(secId){
  const sec=QUESTIONS.find(s=>s&&s.id===secId); if(!sec) return;
  const used=new Set(S.usedQuestions||[]);
  const pool=(sec.items||[]).filter(it=>it&&!used.has(it.id));
  if(!pool.length) return toast('Sem perguntas restantes nessa seção');
  const it=pool[Math.floor(Math.random()*pool.length)];
  /* se tiver alternativas, embaralha a ordem de exibição (a correta some no meio) */
  let order=null;
  if(Array.isArray(it.opts)&&it.opts.length){
    order=it.opts.map((_,i)=>i);
    if(!it.vf){ /* V/F fica fixo (Verdadeiro antes de Falso); só embaralha múltipla escolha */
      for(let i=order.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=order[i]; order[i]=order[j]; order[j]=t; }
    }
  }
  TQ={phase:'q', sec, item:it, tleft:40, order};
  SFX.success();
  stopQuizTimer();
  quizTimerH=setInterval(()=>{
    if(TQ.phase!=='q'||TQ.tleft<=0){ stopQuizTimer(); return; }
    TQ.tleft--;
    const t=document.getElementById('tlTimer');
    if(t){ t.textContent=TQ.tleft>0?TQ.tleft:'⏰'; t.classList.toggle('low',TQ.tleft<=5); }
    if(TQ.tleft>0&&TQ.tleft<=5) SFX.tick();
    if(TQ.tleft<=0){ stopQuizTimer(); SFX.penalty(); }
  },1000);
  renderTelao();
  /* leva a tela até a pergunta, sem o líder precisar rolar */
  setTimeout(()=>{ const qz=document.querySelector('.tl-quiz'); if(qz) qz.scrollIntoView({behavior:'smooth',block:'center'}); },60);
}
/* roleta de bônus ao vivo: sorteia ×1/×2/×3 (×1 comum, ×3 raro) para a resposta atual */
function spinRoulette(){
  if(TQ.phase==='idle') return;
  const btn=document.getElementById('tlSpin'), el=document.getElementById('tlRoulette');
  if(!el) return;
  if(btn) btn.disabled=true;
  const faces=[1,1,1,2,2,3];
  let ticks=0; const total=16+Math.floor(Math.random()*8);
  clearInterval(TQ._rspin);
  TQ._rspin=setInterval(()=>{
    ticks++;
    el.textContent='🎡 ×'+faces[Math.floor(Math.random()*faces.length)];
    SFX.tick();
    if(ticks>=total){
      clearInterval(TQ._rspin);
      TQ.rmult=faces[Math.floor(Math.random()*faces.length)];
      el.textContent='🎡 ×'+TQ.rmult;
      if(TQ.rmult>1){ SFX.fanfare(); confetti(); } else SFX.coin();
      setTimeout(()=>renderTelao(),750);
    }
  },90);
}
function bindTelao(){
  const q=id=>document.getElementById(id);
  if(q('tlClose'))q('tlClose').onclick=closeTelao;
  if(q('tlPod'))q('tlPod').onclick=()=>{
    PR.step=(PR.step+1)%4;
    if(PR.step===1||PR.step===2) SFX.coin();
    if(PR.step===3){ SFX.fanfare(); confetti(); }
    renderTelao();
  };
  if(q('tlQuizBtn'))q('tlQuizBtn').onclick=tlPickSection;
  if(q('tlSpin'))q('tlSpin').onclick=spinRoulette;
  if(q('tlReveal'))q('tlReveal').onclick=()=>{ stopQuizTimer(); TQ.phase='rev'; SFX.success(); renderTelao(); };
  if(q('tlQCancel'))q('tlQCancel').onclick=()=>{ stopQuizTimer(); TQ={phase:'idle'}; renderTelao(); };
  if(q('tlQClose'))q('tlQClose').onclick=()=>{ TQ={phase:'idle'}; renderTelao(); };
  if(q('tlUsed'))q('tlUsed').onclick=async()=>{ const id=TQ.item.id; TQ={phase:'idle'}; await markUsed(id); toast('Pergunta marcada como usada ✓'); renderTelao(); };
  const launch=async(actId,mid,gid)=>{
    const a=ACT[actId]; if(!a) return;
    if(isClosed()) return toast('🔒 Edição encerrada — reabra em ⚙️ Gerenciar para lançar.');
    const item=TQ.item;
    const mult=Math.max(autoMult(actId), TQ.rmult||1);   /* bônus ativo OU roleta (o maior) */
    const key=await fbAddEntry({ts:Date.now(),act:actId,qty:1,d:new Date().toISOString().slice(0,10),
      note:'Quiz'+(item?' '+item.c:''),mid:mid||null,gid,leader:logged||'Telão',...(mult>1?{mult}:{})});
    TQ={phase:'idle'};
    if(key){ SFX.coin(); if(mult>1){ SFX.success(); confetti(); } toast('+'+fmt(ePts(a,{qty:1,mult}))+' pts lançados'+(mult>1?' ⚡×'+mult:'')+' 🌱'); }
    if(item) await markUsed(item.id);
    renderTelao();
  };
  if(q('tlHit'))q('tlHit').onclick=()=>{ const mid=q('tlSeed').value; const m=S.members.find(x=>x.id===mid); launch(QUIZ_ACT[TQ.sec.id],mid,m?m.g:null); };
  if(q('tlTry'))q('tlTry').onclick=()=>launch('prac',null,q('tlGrpT').value);
  if(q('tlHitG'))q('tlHitG').onclick=()=>launch('psem_ok',null,q('tlGrp').value);
  if(q('tlTryG'))q('tlTryG').onclick=()=>launch('psem_tent',null,q('tlGrp').value);
}

/* ============ COMPARTILHAR PLACAR (imagem via canvas → WhatsApp etc.) ============ */
function shareScore(){

  x.fillStyle='#8bd450'; x.fillText(t2,sx+w1,140);

  x.fillText(edLabel()+' · '+new Date().toLocaleDateString('pt-BR'),540,240);

    x.fillStyle='#261e15'; x.strokeStyle=lead?'#f5c542':'#3d3122'; x.lineWidth=lead?6:2;
    x.beginPath(); x.roundRect(cx-210,300,420,330,28); x.fill(); x.stroke();

  x.fillStyle='#f5c542'; x.font='44px Bungee, sans-serif'; x.fillText('VS',540,480);
  /* barra de duelo */
  const bw=840, bx=(1080-bw)/2, r1=p1/((p1+p2)||1);
  x.fillStyle='#211a13'; x.beginPath(); x.roundRect(bx,680,bw,34,17); x.fill();
  x.save(); x.beginPath(); x.roundRect(bx,680,bw,34,17); x.clip();
  x.fillStyle=g1.color; x.fillRect(bx,680,bw*r1,34);
  x.fillStyle=g2.color; x.fillRect(bx+bw*r1,680,bw*(1-r1),34);
  x.restore();

  x.fillStyle='#f5c542'; x.font='900 30px Nunito, sans-serif';
  x.fillText('TOP SEEDS',540,790);
  const med=['🥇','🥈','🥉'];
  ms.forEach((m,i)=>{
    x.fillStyle='#f5eedf'; x.font='700 34px Nunito, sans-serif';
    x.fillText(med[i]+' '+m.n+' · '+fmt(R.ind[m.id]||0)+' pts',540,850+i*54);
  });
  x.fillStyle='#a4957e'; x.font='700 26px Nunito, sans-serif';
  x.fillText(countdownText().replace('⏰','').trim(),540,1030);
  cv.toBlob(async blob=>{
    if(!blob) return toast('Falha ao gerar a imagem');
    const file=new File([blob],'seeds-battle-placar.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{ await navigator.share({files:[file],title:'Seeds Battle',text:'Placar ao vivo da Seeds Battle 🌱⚔️'}); return; }catch(e){ if(e&&e.name==='AbortError') return; }
    }
    const ok=tryDownload('seeds-battle-placar.png',blob);
    toast(ok?'Imagem do placar baixada ✅':'Não foi possível gerar o compartilhamento');
  },'image/png');
}

<script>
/* ============ PAINEL DO LÍDER ============ */

/* ===== Chamada rápida — lança a mesma atividade para vários Seeds ===== */
const PRESENCE_ACTS=['culto_sem','culto_dom','ebd','biblia_ebd','biblia_culto'];

/* ===== Banco de perguntas (só aparece no painel do líder) ===== */
function vQuestions(){
  const used=new Set(S.usedQuestions||[]);
  const total=questionsTotal();
  const totalUsed=QUESTIONS.reduce((s,sec)=>s+((sec.items||[]).filter(it=>used.has(it.id)).length),0);
  let h='<div class="card"><h2>📖 Banco de Perguntas · Parábolas</h2>';

/* Painel de administração do banco: cola o JSON das perguntas e publica no Firebase.
   Como o líder está autenticado, a regra .write: "auth != null" permite o envio. */
function vQuestionsPublish(){

/* Cadastro de UMA pergunta por formulário. Ao publicar, a nova pergunta é
   SOMADA ao banco atual (não substitui as demais). */
function vQuestionsForm(){
  const secs = QSECTIONS_META.map(m=>{ const ex=(QUESTIONS||[]).find(s=>s&&s.id===m.id); return {id:m.id, name:(ex&&ex.name)||m.name}; });

  const opts = secs.map(s=>'<option value="'+esc(s.id)+'">'+esc(s.name)+'</option>').join('');
  return '<details><summary>➕ Cadastrar pergunta (formulário)</summary>'+
    '<p class="hint" style="margin-top:8px">Preencha os campos para adicionar <b>uma</b> pergunta ao banco. Ao publicar, ela é <b>somada</b> às perguntas já existentes (não apaga as outras).</p>'+
    '<div class="field"><label>Seção</label><select id="qfSec">'+opts+'</select></div>'+
    '<div class="field"><label>Código (opcional, ex.: S9, F19)</label><input id="qfCod" placeholder="Em branco = gera automático"></div>'+

function vPanel(R){

      +(S.missions||[]).filter(m=>['active','scheduled'].includes(missionStatus(m))).length
      +((S.boss&&S.boss.active)?1:0);

function vPanelLancar(R){
  const e=editingId?S.entries.find(x=>x.id===editingId):null;
  let selAct=e?e.act:(document.getElementById('fAct')?.value||'culto_sem');
  let a=ACT[selAct];
  if(!a){ selAct='culto_sem'; a=ACT[selAct]; }
  const needMember = a.s!=='group';
  let h='<div class="card"><h2>'+(e?'Corrigir lançamento':'Lançar pontos')+'</h2>';
  if(isClosed()&&!e) h+='<div class="preview" style="color:var(--danger);font-weight:800;margin-bottom:10px">🔒 Edição encerrada — lançamentos bloqueados. Reabra em ⚙️ Gerenciar para lançar.</div>';
  else if(!e) h+='<p class="hint" style="margin-top:-4px;margin-bottom:10px">Registre pontos aqui; a chamada em lote e o histórico ficam logo abaixo.</p>';
  h+='<div class="field"><label>Atividade</label><select id="fAct">'+actOptions()+'</select></div>';
  if(needMember){
    h+='<div class="field"><label>Seed (adolescente)</label><select id="fMem">'+
      S.members.map(m=>{const g=S.groups.find(x=>x.id===m.g);
        return '<option value="'+m.id+'">'+esc(m.n)+' · '+esc(g?g.name:'?')+'</option>';}).join('')+'</select></div>';
  }else{
    h+='<div class="field"><label>Grupo</label><select id="fGrp">'+
      S.groups.map(g=>'<option value="'+g.id+'">'+esc(g.name)+'</option>').join('')+'</select></div>';
  }
  h+='<div class="row2"><div class="field"><label>'+(a.unit?(a.unit==='R$'?'Valor (R$)':'Quantidade ('+esc(a.unit)+')'):'Quantidade')+'</label>'+
     '<input id="fQty" type="number" min="1" value="'+(e?e.qty:1)+'"></div>'+
     '<div class="field"><label>Data</label><input id="fDate" type="date" value="'+(e?e.d:new Date().toISOString().slice(0,10))+'"></div></div>';
  if(a.v>0){
    const autoM=e?eMult(e):autoMult(selAct);
    h+=multField(autoM);
    if(!e&&autoM>1){ const br=bonusForAct(selAct);
      h+='<p class="hint" style="margin:-6px 0 8px;color:var(--gold);font-weight:800">⚡ Bônus ativo aplicado: '+esc(br&&br.label||'')+' ×'+autoM+' — pode ajustar acima.</p>'; }
  }
  h+='<div class="field"><label>Observação (opcional)</label><input id="fNote" maxlength="120" value="'+(e?esc(e.note||''):'')+'" placeholder="Ex.: nome do visitante, motivo da penalidade..."></div>';
  h+='<div class="preview" id="fPrev"></div>';
  h+='<button class="btn go" id="btnSave"'+((isClosed()&&!e)?' disabled style="opacity:.5;cursor:not-allowed"':'')+'>'+(e?'Salvar correção':'Confirmar pontos')+'</button>';
  if(e)h+='<button class="btn ghost" id="btnCancelEdit">Cancelar edição</button>';
  h+='</div>';

  /* chamada em lote */
  h+=vChamada();

  /* histórico (com busca) */
  h+='<div class="card"><h2>Histórico ('+S.entries.length+')</h2>';
  if(!S.entries.length)h+='<p class="hint">Nenhum lançamento ainda. O primeiro ponto planta a primeira semente!</p>';
  else{
    h+='<div class="field" style="margin-top:0"><input id="histQ" placeholder="🔎 Buscar por Seed, atividade, líder, data..." value="'+esc(histFilter)+'"></div>';
    const f=histFilter.trim().toLowerCase();
    let list=[...S.entries].sort((x,y)=>y.ts-x.ts);
    if(f) list=list.filter(en=>{
      const ac=ACT[en.act]; if(!ac) return false;
      const who=en.mid?(S.members.find(m=>m.id===en.mid)?.n||''):(S.groups.find(g=>g.id===en.gid)?.name||'');
      return (who+' '+ac.n+' '+(en.leader||'')+' '+(en.note||'')+' '+en.d.split('-').reverse().join('/')).toLowerCase().includes(f);
    });
    const lim=f?200:40;
    h+='<div class="histscroll">';
    list.slice(0,lim).forEach(en=>{
      const ac=ACT[en.act]; if(!ac)return;
      const pts=ePts(ac,en);
      const who=en.mid?(S.members.find(m=>m.id===en.mid)?.n||'?'):(S.groups.find(g=>g.id===en.gid)?.name||'?');
      h+='<div class="hrow"><div style="display:flex;justify-content:space-between;gap:8px">'+
      '<div><div class="t1">'+esc(who)+' · '+esc(ac.n)+(en.qty>1?' ×'+en.qty:'')+bonusTag(en)+'</div>'+
      '<div class="t2">'+en.d.split('-').reverse().join('/')+' · por '+esc(en.leader)+(en.note?' · “'+esc(en.note)+'”':'')+'</div></div>'+
      '<div class="hp '+(pts<0?'minus':'plus')+'">'+(pts<0?'−':'+')+fmt(Math.abs(pts))+'</div></div>'+
      '<div class="hact"><button class="btn ghost sm" data-edit="'+en.id+'">✏️ Corrigir</button>'+
      '<button class="btn red sm" data-del="'+en.id+'">Excluir</button></div></div>';
    });
    h+='</div>';
    if(f) h+='<p class="hint" style="margin-top:8px">'+list.length+' resultado(s) para "'+esc(histFilter)+'"'+(list.length>lim?' · mostrando '+lim:'')+'.</p>';
    else if(S.entries.length>40) h+='<p class="hint" style="margin-top:8px">Mostrando os 40 mais recentes. Use a busca para achar os demais.</p>';
  }
  h+='</div>';
  return h;
}

function toast(m){const t=document.getElementById('toast');t.classList.remove('act');t.textContent=m;t.classList.add('show');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),2600);}
/* toast com botão de ação (ex.: Desfazer) — fica 6s na tela */
function toastAction(msg,label,fn){
  const t=document.getElementById('toast');
  t.textContent=msg;
  const b=document.createElement('button'); b.className='tbtn'; b.textContent=label;
  b.onclick=()=>{ t.classList.remove('show','act'); fn(); };
  t.appendChild(b);
  t.classList.add('show','act');
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove('show','act'),6000);
}

function buildSheets(){
  const R=calc();
  const indS=[...S.members].sort((a,b)=>tieInd(a.id,b.id,R).n);
  const ind=indS.map((m,i)=>{
    let dz=''; if(i>0 && R.ind[indS[i-1].id]===R.ind[m.id]){ const t=tieInd(indS[i-1].id,m.id,R);
      dz = t.by==='EXTRA'?'Empate — pergunta extra':(t.by?'Atrás por: '+t.by:''); }
    return [i+1, m.n, gName(m.g), R.ind[m.id], dz];
  });
  const grpS=[...S.groups].sort((a,b)=>tieGroup(a.id,b.id,R).n);
  const grp=grpS.map((g,i)=>{
    let dz=''; if(i>0 && R.grp[grpS[i-1].id]===R.grp[g.id]){ const t=tieGroup(grpS[i-1].id,g.id,R);
      dz = t.by==='EXTRA'?'Empate — pergunta extra':(t.by?'Atrás por: '+t.by:''); }
    return [i+1, g.name, R.grp[g.id], S.members.filter(m=>m.g===g.id).length, dz];
  });
  const lanc=[...S.entries].sort((x,y)=>x.ts-y.ts).map(en=>{
    const a=ACT[en.act]; if(!a) return null;
    const who=en.mid?(S.members.find(m=>m.id===en.mid)?.n||''):'';
    const scope=a.s==='both'?'Individual+Grupo':(a.s==='group'?'Grupo':'Individual');
    return [en.d, en.leader||'', a.n, who, gName(en.gid), en.qty, scope, a.v, eMult(en)>1?'×'+eMult(en):'', ePts(a,en), en.note||''];
  }).filter(Boolean);
  const parts=[...S.members].sort((a,b)=>a.g.localeCompare(b.g)||a.n.localeCompare(b.n))
    .map(m=>[m.n, gName(m.g), R.ind[m.id]]);
  const ats=[]; CATS_ALL.forEach(c=>c.acts.forEach(a=>{
    ats.push([a.n, c.name, a.s==='both'?'Individual+Grupo':(a.s==='group'?'Grupo':'Individual'), a.v, a.unit||'']);}));
  return {
    ind:[['Posição','Participante','Grupo','TOTAL','Desempate'], ...ind],
    grp:[['Posição','Grupo','TOTAL','Seeds','Desempate'], ...grp],
    lanc:[['Data','Líder','Atividade','Participante','Grupo','Qtd','Escopo','Pts base','Bônus','Pts (total)','Observação'], ...lanc],
    parts:[['Participante','Grupo','TOTAL'], ...parts],
    ats:[['Atividade','Categoria','Escopo','Pontos','Unidade'], ...ats]
  };
}

function exportXlsx(){
  const S3=buildSheets();
  if(typeof XLSX==='undefined'){ toast('Biblioteca não carregou — exportando CSV'); return exportCsv(); }
  try{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.ind),   'Ranking Individual');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.grp),   'Ranking Grupos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.lanc),  'Lançamentos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.parts), 'Participantes');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.ats),   'Atividades');
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const ok=tryDownload('SeedsBattle_pontos_'+stamp()+'.xlsx', new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    toast(ok?'Excel exportado ✅':'Não foi possível baixar — veja a cópia');
    if(!ok) exportCsv();
  }catch(e){ toast('Erro no Excel — exportando CSV'); exportCsv(); }
}

function exportCsv(){
  const S3=buildSheets();
  const toCsv=rows=>rows.map(r=>r.map(c=>{const s=String(c??'');return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\n');
  const txt='RANKING INDIVIDUAL\n'+toCsv(S3.ind)+'\n\nRANKING GRUPOS\n'+toCsv(S3.grp)+'\n\nLANÇAMENTOS\n'+toCsv(S3.lanc);
  const ok=tryDownload('SeedsBattle_pontos_'+stamp()+'.csv', new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));
  if(!ok) showCopyBox('Pontos (CSV)', txt);
}

async function importJson(text){
  if(!DB) return toast('Configure o Firebase antes de importar');
  let data; try{ data=JSON.parse(text); }catch(e){ return toast('JSON inválido'); }
  if(!data || !Array.isArray(data.members) || !Array.isArray(data.groups) || !Array.isArray(data.entries))
    return toast('Backup não reconhecido');
  const nLead=Array.isArray(data.leaders)?data.leaders.length:0;
  const nAct=Array.isArray(data.customActs)?data.customActs.length:0;
  if(!(await askConfirm('Importar para o Firebase? SUBSTITUI os dados atuais.\n\nVai gravar: '+data.members.length+' participantes, '+nLead+' líderes, '+nAct+' atividades e '+data.entries.length+' lançamentos.'))) return;
  const leaders=(Array.isArray(data.leaders)&&data.leaders.length)
    ? data.leaders.map(l=>({id:l.id||('l'+Math.random().toString(36).slice(2,8)), name:l.name}))
    : [{id:'l1',name:'Coordenação'}];
  const newCfg={ groups:data.groups, members:data.members, leaders,
    customActs:Array.isArray(data.customActs)?data.customActs:[],
    usedQuestions:Array.isArray(data.usedQuestions)?data.usedQuestions:[],
    bonusRules:Array.isArray(data.bonusRules)?data.bonusRules:[],
    missions:Array.isArray(data.missions)?data.missions:[],
    pass:(data.pass&&Array.isArray(data.pass.tiers))?data.pass:{basis:'combined',tiers:[]},
    boss:data.boss||null,
    rosterSeeded:data.rosterSeeded||'ed1-18' };
  const shards={};
  for(const e of data.entries){
    const {id, ...rest}=e; const k=newEntryId(rest.d);
    (shards[entryShard(k)]=shards[entryShard(k)]||{})[k]=rest;
  }
  try{
    const batch=DB.batch();
    (await DB.collection('entries').get()).forEach(d=>batch.delete(d.ref));
    Object.entries(shards).forEach(([m,obj])=>batch.set(DB.doc('entries/'+m),obj));
    batch.set(DB.doc('app/config'),newCfg);
    await batch.commit();
    toast('Importado ✅ '+leaders.length+' líderes · '+newCfg.customActs.length+' atividades · '+data.entries.length+' lançamentos');
  }catch(err){ toast('Falha ao importar: '+(err.code||err.message)); }
}

/* Resultado atual da edição (campeões) — usado na Colheita dos Campeões */
function editionResult(){
  const R=calc();
  const gs=[...S.groups].sort((a,b)=>tieGroup(a.id,b.id,R).n);
  const ms=[...S.members].sort((a,b)=>tieInd(a.id,b.id,R).n);
  const champ=gs[0], top=ms[0];
  if(!champ||!top) return null;
  const e=edInfo();
  return {
    name:e.name+(e.theme?' · '+e.theme:''),
    champion:champ.name, championPts:R.grp[champ.id]||0,
    topSeed:top.n, topSeedPts:R.ind[top.id]||0,
    closedAt:new Date().toISOString()
  };
}

/* Encerra a edição: registra o resultado na Colheita dos Campeões E bloqueia novos
   lançamentos. Não apaga nada — é reversível em "Reabrir edição". */
async function closeEdition(){
  if(!DB) return toast('Firebase não configurado');
  const res=editionResult();
  if(!res) return toast('Sem dados suficientes');
  if(!(await askConfirm('Encerrar a edição "'+edInfo().name+'"?\n\n🏆 '+res.champion+' ('+fmt(res.championPts)+' pts)\n🥇 '+res.topSeed+' ('+fmt(res.topSeedPts)+' pts)\n\n• Registra o resultado na Colheita dos Campeões\n• BLOQUEIA novos lançamentos de pontos\n• NÃO apaga nada (dá pra reabrir depois)'))) return;
  try{
    const c=currentConfig(); c.editionClosed={at:new Date().toISOString()};
    const batch=DB.batch();
    batch.set(DB.doc('app/hall'),{[edInfo().key]:res},{merge:true});
    batch.set(DB.doc('app/config'),c);
    await batch.commit();
    toast('🏁 Edição encerrada e registrada na Colheita dos Campeões 🏛️'); SFX.fanfare();
  }catch(e){ toast('Falha: '+(e.code||e.message)); }
}
/* Reabre a edição — libera os lançamentos de novo (mantém o registro no Hall) */
async function reopenEdition(){
  if(!DB) return toast('Firebase não configurado');
  if(!(await askConfirm('Reabrir a edição? Os lançamentos de pontos voltam a ser permitidos.\n(O resultado continua na Colheita dos Campeões.)'))) return;
  const c=currentConfig(); c.editionClosed=null;
  await fbSaveConfig(c); toast('Edição reaberta ✅');
}

/* Vira a chave: arquiva a edição atual no Hall, APAGA os lançamentos e
   inicia a próxima edição com os dados do formulário do painel. */
async function startNewEdition(name,theme,start,end){
  if(!DB) return toast('Firebase não configurado');
  if(!name||!start||!end) return toast('Preencha nome e datas da nova edição');
  if(end<start) return toast('A data final vem antes da inicial');
  const cur=edInfo(), res=editionResult();
  const nextKey='ed'+((parseInt(String(cur.key).replace(/\D/g,''),10)||0)+1);
  const n=S.entries.length;
  if(!(await askConfirm('Iniciar "'+name+'"?\n\n1. Grava o resultado de "'+cur.name+'" na Colheita dos Campeões\n2. APAGA os '+n+' lançamentos atuais (o placar zera)\n3. Limpa as perguntas marcadas e as regras de bônus\n\nParticipantes, grupos e atividades são mantidos.'))) return;
  if(!(await askConfirm('Tem certeza? Os '+n+' lançamentos serão apagados de vez.\n(O resultado fica na Colheita dos Campeões; o backup semanal guarda o histórico.)'))) return;
  try{
    const c=currentConfig();
    c.edition={key:nextKey,name,theme:theme||'',start,end};
    c.usedQuestions=[];
    c.bonusRules=[];
    c.missions=[];
    c.pass={basis:'combined',tiers:[]};
    c.boss=null;
    c.editionClosed=null;
    const batch=DB.batch();
    if(res) batch.set(DB.doc('app/hall'),{[cur.key]:res},{merge:true});
    (await DB.collection('entries').get()).forEach(d=>batch.delete(d.ref));
    batch.set(DB.doc('app/config'),c);
    await batch.commit();
    toast(name+' iniciada! 🚀 Boa batalha!'); SFX.fanfare();
  }catch(e){ toast('Falha ao iniciar edição: '+(e.code||e.message)); }
}

function updatePrev(){
  const sel=document.getElementById('fAct'); if(!sel)return;
  const a=ACT[sel.value], q=Math.max(1,parseInt(document.getElementById('fQty').value||'1',10));
  const mEl=document.getElementById('fMult'); const mult=(mEl&&a.v>0)?+mEl.value:1;
  const pts=ePts(a,{qty:q,mult});
  const scope=a.s==='both'?'Seed + grupo recebem':(a.s==='group'?'Só o grupo recebe':'Só o Seed recebe');
  document.getElementById('fPrev').textContent=(pts<0?'−':'+')+fmt(Math.abs(pts))+' pts'+(mult>1?' (⚡×'+mult+')':'')+' · '+scope+
    (a.cap?' · sujeito a teto':'');
}

    const c=currentConfig(); c.usedQuestions=[...set];
    await fbSaveConfig(c); SFX.tick();
    toast(wasOn?'Pergunta liberada de novo':'Pergunta marcada como usada ✓');});
  if(q('btnQPublish'))q('btnQPublish').onclick=async()=>{
    const raw=(q('qJson')&&q('qJson').value||'').trim();
    if(!raw)return toast('Cole o JSON das perguntas primeiro');
    let arr; try{ arr=JSON.parse(raw); }catch(e){ return toast('JSON inválido: '+e.message); }
    if(!Array.isArray(arr)||!arr.length)return toast('O JSON deve ser um array de seções');
    const bad=arr.some(sec=>!sec||!Array.isArray(sec.items));
    if(bad)return toast('Cada seção precisa ter uma lista "items"');
    const n=arr.reduce((s,sec)=>s+sec.items.length,0);
    if(!(await askConfirm('Publicar '+arr.length+' seção(ões) e '+n+' pergunta(s)? Isso substitui o banco atual no Firebase.')))return;
    await fbPublishQuestions(arr);};
  if(q('qfTipo')){
    const updTipo=()=>{ const t=q('qfTipo').value;
      if(q('qfMcBox')) q('qfMcBox').style.display = t==='mc'?'':'none';
      if(q('qfVfBox')) q('qfVfBox').style.display = t==='vf'?'':'none';
      if(q('qfQLbl')) q('qfQLbl').textContent = t==='vf'?'Afirmação (para julgar V ou F)':'Pergunta';
    };
    q('qfTipo').onchange=updTipo; updTipo();
  }
  if(q('btnQAdd'))q('btnQAdd').onclick=async()=>{
    const secId=(q('qfSec')&&q('qfSec').value)||'';
    const cod=(q('qfCod')&&q('qfCod').value||'').trim();
    const tipo=(q('qfTipo')&&q('qfTipo').value)||'aberta';
    const perg=(q('qfQ')&&q('qfQ').value||'').trim();
    let resp=(q('qfA')&&q('qfA').value||'').trim();
    const ref=(q('qfR')&&q('qfR').value||'').trim();
    if(!secId)return toast('Escolha a seção');
    if(!perg)return toast(tipo==='vf'?'Digite a afirmação':'Digite a pergunta');
    if(tipo==='aberta'&&!resp)return toast('Digite a resposta');
    const bank=JSON.parse(JSON.stringify(Array.isArray(QUESTIONS)?QUESTIONS:[]));
    let sec=bank.find(s=>s&&s.id===secId);
    if(!sec){ const meta=QSECTIONS_META.find(m=>m.id===secId)||{id:secId,name:secId,pts:''}; sec={id:meta.id,name:meta.name,pts:meta.pts,items:[]}; bank.push(sec); }
    if(!Array.isArray(sec.items)) sec.items=[];
    const allIds=new Set(); bank.forEach(s=>(s&&s.items||[]).forEach(it=>it&&it.id&&allIds.add(it.id)));
    let nid; do{ nid='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }while(allIds.has(nid));
    const meta=QSECTIONS_META.find(m=>m.id===secId);
    const pref=(meta&&meta.pref)||(secId[0]||'Q').toUpperCase();
    const item={ id:nid, c:cod||(pref+(sec.items.length+1)), q:perg, r:ref };
    if(tipo==='mc'){
      const opts=['qfO1','qfO2','qfO3','qfO4'].map(id=>(q(id)&&q(id).value||'').trim()).filter(Boolean);
      if(opts.length<2)return toast('Preencha ao menos 2 alternativas');
      let correct=parseInt((q('qfCorrect')&&q('qfCorrect').value)||'0',10);
      if(!(correct>=0&&correct<opts.length)) correct=0;
      item.opts=opts; item.correct=correct;
      if(!resp) resp=opts[correct];
    }else if(tipo==='vf'){
      const correct=parseInt((q('qfVfCorrect')&&q('qfVfCorrect').value)||'0',10)===1?1:0;
      item.opts=['Verdadeiro','Falso']; item.correct=correct; item.vf=true;
      if(!resp) resp=(correct===0?'Verdadeiro':'Falso');
    }
    item.a=resp;
    if(!(await askConfirm('Adicionar a pergunta na seção "'+(sec.name||sec.id)+'" e publicar no Firebase?')))return;
    sec.items.push(item);
    await fbPublishQuestions(bank);};
  if(q('btnQClear'))q('btnQClear').onclick=async()=>{
    if(!(S.usedQuestions&&S.usedQuestions.length))return toast('Nenhuma pergunta marcada');
    if(!(await askConfirm('Desmarcar todas as perguntas usadas? Isso zera o controle para todos os líderes.')))return;
    const c=currentConfig(); c.usedQuestions=[];
    await fbSaveConfig(c); toast('Marcações limpas');};
  document.querySelectorAll('[data-delact]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delact, used=S.entries.filter(e=>e.act===id).length;
    const msg=used?('Essa atividade tem '+used+' lançamento(s). Se remover, esses pontos deixam de contar. Remover mesmo assim?'):'Remover esta atividade personalizada?';
    if(!(await askConfirm(msg)))return;
    const c=currentConfig(); c.customActs=(c.customActs||[]).filter(a=>a.id!==id);
    await fbSaveConfig(c); toast('Atividade removida');});
  /* ===== modo telão + compartilhar (aba Grupos) ===== */
  if(q('btnTelao'))q('btnTelao').onclick=()=>{ SFX.tick(); openTelao(); };
  if(q('btnShare'))q('btnShare').onclick=()=>{ SFX.tick(); shareScore(); };
  if(q('btnShareClose'))q('btnShareClose').onclick=()=>{ SFX.tick(); shareClosing(); };
  /* ===== chamada em lote ===== */
  document.querySelectorAll('[data-chall]').forEach(b=>b.onclick=()=>{
    const boxes=[...document.querySelectorAll('.chkm')].filter(c=>c.dataset.gid===b.dataset.chall);
    const all=boxes.length&&boxes.every(c=>c.checked);
    boxes.forEach(c=>c.checked=!all);
  });
  if(q('btnChamada'))q('btnChamada').onclick=async()=>{
    if(isClosed()) return toast('🔒 Edição encerrada — reabra em ⚙️ Gerenciar para lançar.');
    const sel=[...document.querySelectorAll('.chkm:checked')];
    if(!sel.length) return toast('Marque ao menos 1 Seed');
    if(!DB) return toast('Firebase não configurado');
    const act=q('chAct').value, a=ACT[act]; if(!a) return;
    const d=q('chDate').value||new Date().toISOString().slice(0,10);
    if(!(await askConfirm('Lançar "'+a.n+'" (+'+a.v+' cada) para '+sel.length+' Seed(s) em '+d.split('-').reverse().join('/')+'?'))) return;
    const upd={}, keys=[];
    sel.forEach(c=>{ const k=newEntryId(d); keys.push(k);
      upd[k]={ts:Date.now(),act,qty:1,d,note:'',mid:c.dataset.mid,gid:c.dataset.gid,leader:logged}; });
    const shardDoc=DB.doc('entries/'+entryShard(keys[0]));
    try{
      await shardDoc.set(upd,{merge:true}); /* gravação única e atômica (mesmo dia → mesmo doc) */
      SFX.success();
      toastAction(sel.length+' lançamento(s) feitos ✅','Desfazer',async()=>{
        const args=[]; keys.forEach(k=>{ args.push(fp(k),fdel()); });
        try{ await shardDoc.update(...args); toast('Chamada desfeita ↩️'); }
        catch(e){ toast('Falha ao desfazer: '+(e.code||e.message)); }
      });
    }catch(e){ toast('Falha: '+(e.code||e.message)); }
  };
  /* ===== busca no histórico (mantém o foco após re-render) ===== */
  if(q('histQ')){
    q('histQ').oninput=()=>{
      histFilter=q('histQ').value;
      clearTimeout(window._hqT);
      window._hqT=setTimeout(()=>{
        render();
        const el=document.getElementById('histQ');
        if(el){ el.focus({preventScroll:true}); el.setSelectionRange(el.value.length,el.value.length); }
      },300);
    };
  }
  /* ===== sortear pergunta (banco de perguntas) ===== */
  document.querySelectorAll('[data-qdraw]').forEach(b=>b.onclick=()=>{
    const sec=QUESTIONS.find(s=>s&&s.id===b.dataset.qdraw); if(!sec) return;
    const used=new Set(S.usedQuestions||[]);
    const pool=(sec.items||[]).filter(it=>it&&!used.has(it.id));
    if(!pool.length) return toast('Todas as perguntas desta seção já foram usadas');
    SFX.tick();
    showQuestionModal(sec, pool[Math.floor(Math.random()*pool.length)]);
  });
  /* ===== encerrar edição ===== */
  if(q('btnCloseEd'))q('btnCloseEd').onclick=()=>closeEdition();
  if(q('btnReopenEd'))q('btnReopenEd').onclick=()=>reopenEdition();
  /* ===== edição configurável ===== */
  if(q('btnEdSave'))q('btnEdSave').onclick=async()=>{
    const name=q('edName').value.trim(), theme=q('edTheme').value.trim(),
          start=q('edStart').value, end=q('edEnd').value;
    if(!name||!start||!end) return toast('Preencha nome e datas');
    if(end<start) return toast('A data final vem antes da inicial');
    const c=currentConfig(); c.edition={...edInfo(),name,theme,start,end};
    await fbSaveConfig(c); toast('Edição atualizada 🎪');
  };
  if(q('btnNewEd'))q('btnNewEd').onclick=()=>startNewEdition(
    q('edName').value.trim(), q('edTheme').value.trim(), q('edStart').value, q('edEnd').value);
}
buildFx();
initMute();
initMusic();
load();
updCountdown();
setInterval(updCountdown,60000);
/* PWA: registra o service worker (só em https/localhost — no file:// é ignorado) */
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
