<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Seeds Battle · Edição 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<style>
:root{
  --soil:#171310; --soil2:#211a13; --card:#261e15; --card2:#2e2419;
  --line:#3d3122; --leaf:#8bd450; --leaf-dim:#5c9938; --gold:#f5c542;
  --cream:#f5eedf; --muted:#a4957e; --danger:#e5604c;
  --g1:#8bd450; --g2:#f2a93b;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--soil);color:var(--cream);font-family:'Nunito',system-ui,sans-serif;min-height:100vh;
  background-image:radial-gradient(1200px 500px at 50% -200px,#2a2115 0%,var(--soil) 60%)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 90px}
.display{font-family:'Bungee',system-ui,sans-serif;font-weight:400;letter-spacing:.5px}

/* header */
header{text-align:center;padding:18px 0 10px}
.logo{font-size:clamp(30px,8vw,44px);line-height:1;color:var(--cream)}
.logo .b{color:var(--leaf)}
.tagline{color:var(--gold);font-size:13px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-top:6px}
.dates{color:var(--muted);font-size:12px;margin-top:4px;font-weight:700}

/* tabs */
nav{position:fixed;bottom:0;left:0;right:0;background:#1d1710;border-top:1px solid var(--line);
  z-index:50;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.histscroll{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -4px;padding:0 4px 2px;overscroll-behavior:contain}
.tab{appearance:none;background:none;border:none;color:var(--muted);font-family:'Nunito';font-weight:800;
  font-size:11px;padding:10px 4px 12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;align-items:center}
.tab .ic{font-size:20px;line-height:1}
.tab.on{color:var(--leaf)}
.tab:focus-visible{outline:2px solid var(--gold);outline-offset:-2px;border-radius:8px}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px}
.card h2{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
.hint{color:var(--muted);font-size:12.5px;line-height:1.5}

/* battle hero */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-top:14px}
.gcard{position:relative;border-radius:var(--r);padding:14px 12px;text-align:center;border:1px solid var(--line);background:var(--card)}
.gcard.lead{box-shadow:0 0 0 1px var(--gold),0 6px 24px -8px rgba(245,197,66,.35);animation:leadPulse 2.4s ease-in-out infinite}
.gseed{font-size:34px;line-height:1}
.gname{font-weight:900;font-size:15px;margin-top:6px;word-break:break-word}
.gpts{font-family:'Bungee';font-size:26px;margin-top:4px}
.gsub{color:var(--muted);font-size:11px;font-weight:700;margin-top:2px}
.vsmid{display:flex;align-items:center;justify-content:center}
.vsbadge{font-family:'Bungee';color:var(--soil);background:var(--gold);border-radius:10px;padding:8px 9px;font-size:15px}
.duel{position:relative;margin-top:14px;background:var(--soil2);border:1px solid var(--line);border-radius:999px;height:22px;
  overflow:hidden;display:flex}
.duel>div{height:100%;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.duel .d1{background:linear-gradient(90deg,var(--g1),#a8e878)}
.duel .d2{background:linear-gradient(90deg,#ffc86b,var(--g2));margin-left:auto}
.duel .seam{position:absolute;top:0;bottom:0;left:var(--w1,50%);width:2px;transform:translateX(-1px);
  background:rgba(255,255,255,.92);box-shadow:0 0 8px 2px var(--gold);opacity:.7;
  transition:left .8s cubic-bezier(.2,.8,.2,1);animation:seamGlow 2s ease-in-out infinite}
@keyframes seamGlow{0%,100%{opacity:.45}50%{opacity:.9}}
/* aba Grupos — pulso do líder, entrada em cascata e partículas */
@keyframes leadPulse{
  0%,100%{box-shadow:0 0 0 1px var(--gold),0 6px 20px -10px rgba(245,197,66,.4)}
  50%{box-shadow:0 0 0 1px var(--gold),0 10px 30px -6px rgba(245,197,66,.7)}}
@keyframes gPop{0%{opacity:0;transform:translateY(24px) scale(.8)}60%{opacity:1;transform:translateY(-5px) scale(1.05)}100%{opacity:1;transform:none}}
@keyframes gFade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.gEnter .gcard,.gEnter .vsmid{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.gEnter .vs .gcard:nth-child(1){animation-delay:.04s}
.gEnter .vs .vsmid{animation-delay:.16s}
.gEnter .vs .gcard:nth-child(3){animation-delay:.28s}
.gEnter .duel{animation:gFade .5s ease .34s both}
.gEnter .pill{animation:gFade .4s ease both;animation-delay:calc(var(--i,0)*28ms + .12s)}
/* aba Seeds — entrada em cascata + brilho da medalha */
.iEnter .pod{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.iEnter .podium .pod:nth-child(1){animation-delay:.1s}
.iEnter .podium .pod:nth-child(2){animation-delay:0s}
.iEnter .podium .pod:nth-child(3){animation-delay:.16s}
.iEnter .rrow{animation:gFade .4s ease both;animation-delay:calc(var(--i,0)*45ms + .1s)}
.pod.p1 .medal{display:inline-block;animation:medalShine 2.6s ease-in-out infinite}
@keyframes medalShine{0%,100%{transform:scale(1) rotate(-4deg)}50%{transform:scale(1.12) rotate(4deg)}}
.leadfx{position:absolute;inset:0;pointer-events:none;z-index:3}
.leadfx span{position:absolute;left:50%;top:40%;width:7px;height:7px;border-radius:99px;
  background:var(--gold);box-shadow:0 0 6px var(--gold);opacity:0;animation:leadSpark .8s ease-out forwards}
@keyframes leadSpark{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
/* fundos temáticos por aba */
.gwrap,.iwrap,.twrap,.lwrap{position:relative}
.gwrap>*,.iwrap>*,.twrap>*,.lwrap>*{position:relative;z-index:1}
.tabbg{position:absolute;top:-14px;left:-14px;right:-14px;height:300px;z-index:0;pointer-events:none;
  opacity:.5;-webkit-mask-image:linear-gradient(#000 52%,transparent);mask-image:linear-gradient(#000 52%,transparent)}
.gbg .bg-path{fill:none;stroke:var(--line);stroke-width:6;stroke-dasharray:2 12;stroke-linecap:round}
.gbg .bg-soil{fill:var(--soil2)}
.gbg .bg-furrow path{fill:none;stroke:var(--line);stroke-width:3;stroke-linecap:round}
.gbg .bg-sprout path{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.gbg .bg-sprout>g{transform-box:fill-box;transform-origin:bottom center;animation:bgSway 6s ease-in-out infinite}
.gbg .bg-sprout>g:nth-child(2){animation-duration:7.5s;animation-delay:-2s}
.gbg .bg-sprout>g:nth-child(3){animation-duration:5.5s;animation-delay:-1s}
.gbg .bg-seeds circle{fill:var(--leaf-dim);animation:bgFloat 7s ease-in-out infinite}
.gbg .bg-seeds circle:nth-child(2n){animation-duration:9s}
.gbg .bg-seeds circle:nth-child(3n){animation-duration:6s;animation-delay:-2s}
@keyframes bgSpin{to{transform:rotate(360deg)}}
@keyframes bgSway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes bgFloat{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-6px);opacity:1}}
/* fundo aba Seeds */
.seedsbg .sb-leaf{fill:var(--leaf);opacity:.16}
.seedsbg .sb-vein{fill:none;stroke:var(--leaf-dim);stroke-width:2;opacity:.4}
.seedsbg .stalk{fill:none;stroke:var(--leaf-dim);stroke-width:3;stroke-linecap:round}
.seedsbg .lf{fill:none;stroke:var(--leaf);stroke-width:3;stroke-linecap:round}
.seedsbg .sb-plants>g{transform-box:fill-box;transform-origin:bottom center;animation:bgSway 6s ease-in-out infinite}
.seedsbg .sb-plants>g:nth-child(2){animation-duration:7s;animation-delay:-1s}
.seedsbg .sb-plants>g:nth-child(3){animation-duration:5.5s;animation-delay:-2s}
.seedsbg .sb-plants>g:nth-child(4){animation-duration:6.5s;animation-delay:-.5s}
.seedsbg .sb-plants>g:nth-child(5){animation-duration:7.5s;animation-delay:-3s}
/* fundo aba Tabela */
.tablebg .tb-rays path{fill:var(--gold);opacity:.1}
.tablebg .tb-rays{animation:tbGlow 5s ease-in-out infinite}
.tablebg .pg{fill:var(--card2);stroke:var(--line);stroke-width:2}
.tablebg .spine{fill:none;stroke:var(--gold);stroke-width:2}
.tablebg .tb-lines path{stroke:var(--muted);stroke-width:2;stroke-linecap:round;opacity:.5}
.tablebg .tb-spark{fill:var(--gold);animation:bgFloat 4s ease-in-out infinite}
/* fundo aba Líder */
.leaderbg .lb-rays path{fill:var(--gold);opacity:.1}
.leaderbg .lb-rays{animation:tbGlow 5s ease-in-out infinite}
.leaderbg .sh{fill:none;stroke:var(--gold);stroke-width:3;opacity:.6}
.leaderbg .sh-in{fill:var(--card2);stroke:var(--line);stroke-width:2}
.leaderbg .sh-leaf{fill:var(--leaf);opacity:.7}
.leaderbg .lb-shield{transform-box:fill-box;transform-origin:center;animation:shieldPulse 3.5s ease-in-out infinite}
@keyframes tbGlow{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes shieldPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
/* ===== backdrop global animado (todas as abas) ===== */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.wrap{position:relative;z-index:1}
.fx-glow{position:absolute;border-radius:50%;filter:blur(64px);opacity:.2}
.fx-glow.g-leaf{width:340px;height:340px;background:var(--leaf);left:-90px;top:8%;animation:fxDrift1 18s ease-in-out infinite}
.fx-glow.g-gold{width:300px;height:300px;background:var(--gold);right:-80px;top:42%;animation:fxDrift2 22s ease-in-out infinite}
.fx-glow.g-leaf2{width:260px;height:260px;background:var(--leaf-dim);left:30%;bottom:-100px;animation:fxDrift1 26s ease-in-out infinite reverse}
@keyframes fxDrift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,30px) scale(1.15)}}
@keyframes fxDrift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,-30px) scale(1.12)}}
.fx-p{position:absolute;bottom:-40px;opacity:0;will-change:transform,opacity;animation:fxRise linear infinite}
@keyframes fxRise{
  0%{transform:translateY(0) translateX(0) rotate(0);opacity:0}
  10%{opacity:.55}
  90%{opacity:.55}
  100%{transform:translateY(-118vh) translateX(var(--sx,0)) rotate(var(--rot,180deg));opacity:0}}
/* ===== entrada em cascata Tabela / Líder ===== */
.tEnter .card{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.tEnter details{animation:gFade .4s ease both;animation-delay:calc(var(--i,0)*55ms + .12s)}
.lEnter .card{animation:gPop .5s cubic-bezier(.2,1.25,.4,1) both}
.lEnter .card:nth-child(2){animation-delay:.06s}
.lEnter .card:nth-child(3){animation-delay:.16s}
.lEnter .card:nth-child(4){animation-delay:.26s}
/* ===== brilho de varredura (shimmer) — cara de game ===== */
.vsbadge,.pod.p1{position:relative;overflow:hidden}
.vsbadge::after,.pod.p1::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);
  animation:sweep 3.2s ease-in-out infinite}
.pod.p1::after{animation-duration:3.8s}
@keyframes sweep{0%{left:-70%}35%{left:130%}100%{left:130%}}
/* ===== nav com feedback de game ===== */
.tab{transition:transform .12s ease}
.tab:active{transform:scale(.88)}
.tab.on .ic{animation:tabBounce 1.8s ease-in-out infinite}
@keyframes tabBounce{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-3px) scale(1.12)}}
.legend{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:800;margin-top:6px}

/* individual ranking */
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:end;margin-top:14px}
.pod{background:var(--card);border:1px solid var(--line);border-radius:var(--r);text-align:center;padding:12px 6px}
.pod .medal{font-size:26px}
.pod .pn{font-weight:900;font-size:13px;margin-top:4px;word-break:break-word}
.pod .pp{font-family:'Bungee';font-size:16px;color:var(--gold);margin-top:2px}
.pod.p1{padding-top:20px;box-shadow:0 0 0 1px var(--gold) inset}
.rlist{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.rrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;
  grid-template-columns:28px 34px 1fr auto;gap:10px;align-items:center}
.rrow .pos{font-family:'Bungee';color:var(--muted);font-size:14px}
.rrow .plant{font-size:24px;text-align:center}
.rrow .nm{font-weight:900;font-size:14px}
.rrow .lvl{color:var(--muted);font-size:11px;font-weight:800}
.rrow .pts{font-family:'Bungee';color:var(--gold);font-size:15px;text-align:right}
.xp{height:7px;border-radius:99px;background:var(--soil2);border:1px solid var(--line);margin-top:5px;overflow:hidden}
.xp>i{display:block;height:100%;background:linear-gradient(90deg,var(--leaf-dim),var(--leaf));transition:width .6s}
.gdot{display:inline-block;width:9px;height:9px;border-radius:99px;margin-right:5px;vertical-align:1px}

/* table tab */
.ptable{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.ptable th{color:var(--gold);text-align:left;font-size:11px;letter-spacing:1px;text-transform:uppercase;
  padding:8px 6px;border-bottom:1px solid var(--line)}
.ptable td{padding:7px 6px;border-bottom:1px solid #2c2318;font-weight:700}
.ptable td:last-child{text-align:right;font-family:'Bungee';font-size:12px;color:var(--cream);white-space:nowrap}
.neg td:last-child{color:var(--danger)}

/* leader panel */
.field{margin-top:12px}
label{display:block;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input,select,textarea{width:100%;background:var(--soil2);border:1px solid var(--line);border-radius:10px;color:var(--cream);
  font-family:'Nunito';font-weight:700;font-size:15px;padding:11px 12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--leaf);outline-offset:-1px}
.btn{appearance:none;border:none;border-radius:12px;font-family:'Nunito';font-weight:900;font-size:15px;
  padding:13px 16px;cursor:pointer;width:100%;margin-top:14px}
.btn.go{background:var(--leaf);color:#14200b}
.btn.gold{background:var(--gold);color:#241c06}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn.red{background:transparent;color:var(--danger);border:1px solid #5a3029}
.btn.sm{width:auto;padding:8px 12px;font-size:12.5px;margin-top:0;border-radius:9px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.preview{margin-top:12px;background:var(--soil2);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;
  font-size:13px;font-weight:800;color:var(--gold)}
.hrow{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:13px}
.hrow .t1{font-weight:900}
.hrow .t2{color:var(--muted);font-size:11.5px;font-weight:700;margin-top:2px}
.hrow .hp{font-family:'Bungee';font-size:14px}
.hrow .hp.plus{color:var(--leaf)} .hrow .hp.minus{color:var(--danger)}
.hact{display:flex;gap:8px;margin-top:8px}
.capnote{margin-top:8px;font-size:12px;font-weight:800;color:var(--gold)}
.pill{display:inline-block;background:var(--soil2);border:1px solid var(--line);border-radius:99px;
  padding:3px 10px;font-size:11px;font-weight:800;color:var(--muted);margin:3px 3px 0 0}
.who{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.who .wn{font-weight:900;color:var(--leaf);font-size:13px}

/* toast + misc */
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(20px);opacity:0;
  background:var(--gold);color:#241c06;font-weight:900;font-size:14px;padding:11px 18px;border-radius:12px;
  transition:.25s;z-index:99;max-width:90vw;text-align:center;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mutebtn{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));right:10px;z-index:60;width:38px;height:38px;
  border-radius:50%;border:1px solid var(--line);background:#1d1710cc;color:var(--cream);font-size:17px;line-height:1;
  cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;transition:transform .12s ease}
.mutebtn:active{transform:scale(.88)}
.mutebtn.off{opacity:.45}
.mutebtn.m2{right:56px}
.loading{text-align:center;padding:60px 0;color:var(--muted);font-weight:800}
.seedspin{font-size:40px;display:inline-block;animation:grow 1.2s ease-in-out infinite alternate}
@keyframes grow{from{transform:scale(.85) rotate(-6deg)}to{transform:scale(1.1) rotate(6deg)}}
.view{display:none}.view.on{display:block}
details{margin-top:10px}
summary{cursor:pointer;font-weight:900;font-size:13px;color:var(--cream);padding:6px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@media (max-width:380px){.gpts{font-size:21px}.vsbadge{font-size:13px}}

/* banco de perguntas (só líder) */
.qrow.used{opacity:.5}
.qrow.used .qq{text-decoration:line-through;text-decoration-color:var(--leaf-dim)}
.qq{font-weight:800;font-size:13px;line-height:1.45}
.qq b{color:var(--gold)}
.qbadge{display:inline-block;background:var(--leaf);color:#14200b;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:900;margin-left:6px;white-space:nowrap}
.qansd{margin-top:8px}
.qansd summary{font-size:12px;color:var(--muted);font-weight:800}
.qans{color:var(--leaf);font-weight:800;font-size:13px;line-height:1.5;margin-top:4px}
.qref{color:var(--muted);font-size:11px;font-weight:700;margin-top:3px}
.qsecmeta{color:var(--muted);font-weight:800;font-size:11px}
</style>
</head>
<body>
<div id="fx" aria-hidden="true">
  <div class="fx-glow g-leaf"></div>
  <div class="fx-glow g-gold"></div>
  <div class="fx-glow g-leaf2"></div>
  <div class="fx-parts"></div>
</div>
<div class="wrap">
  <header>
    <div class="logo display">SEEDS <span class="b">BATTLE</span></div>
    <div class="tagline">Ouvi · Entendi · Vivi</div>
    <div class="dates">Edição 1 · Parábolas de Jesus · 01/07 → 01/08</div>
  </header>

  <div id="app"><div class="loading"><span class="seedspin">🌱</span><br><br>Preparando o solo...</div></div>
</div>

<nav aria-label="Navegação principal"><div class="tabs">
  <button class="tab on" data-v="groups"><span class="ic">⚔️</span>Grupos</button>
  <button class="tab" data-v="ind"><span class="ic">🌱</span>Seeds</button>
  <button class="tab" data-v="table"><span class="ic">📖</span>Tabela</button>
  <button class="tab" data-v="leader"><span class="ic">🛡️</span>Líder</button>
</div></nav>

<div id="toast" role="status"></div>
<button id="musicBtn" class="mutebtn m2" aria-label="Música de fundo" title="Música de fundo">🎵</button>
<button id="muteBtn" class="mutebtn" aria-label="Ativar ou silenciar sons" title="Efeitos sonoros">🔊</button>
<script>
/* ============ CATÁLOGO (do regulamento oficial) ============ */
/* scope: both = adolescente + grupo · group = só grupo · ind = só adolescente */
const CATS = [
 {id:'presenca', name:'Presença e participação', acts:[
   {id:'culto_sem', n:'Presença em culto da semana', v:10, s:'both'},
   {id:'culto_dom', n:'Presença em culto de domingo', v:20, s:'both'},
   {id:'ebd', n:'Presença na EBD', v:30, s:'both'},
   {id:'biblia_ebd', n:'Levar Bíblia na EBD', v:10, s:'both'},
   {id:'biblia_culto', n:'Levar Bíblia no culto', v:10, s:'both'}]},
 {id:'visit', name:'Visitantes', acts:[

/* ============ CÁLCULO (com tetos do regulamento) ============ */
function calc(){
  const ind={}, grp={}, capUse={}, stats={}, mstats={};
  S.members.forEach(m=>{ind[m.id]=0; mstats[m.id]={oficialCount:0,ebd:0,vis:0,pen:0};});
  S.groups.forEach(g=>{grp[g.id]=0; capUse[g.id]={alim:0,agas:0};
    stats[g.id]={oficial:0,ebd:0,visnc:0,pen:0};});
  const ofertaRaw={}; S.members.forEach(m=>ofertaRaw[m.id]=0);
  const ofertaMemG={};
  for(const e of S.entries){
    const a=ACT[e.act]; if(!a) continue;
    const pts=a.v*e.qty;
    if(a.cap==='oferta'){ ofertaRaw[e.mid]=(ofertaRaw[e.mid]||0)+pts; ofertaMemG[e.mid]=e.gid; continue; }
    if(a.cap==='alim'||a.cap==='agas'){ if(capUse[e.gid]) capUse[e.gid][a.cap]+=pts; continue; }
    if((a.s==='both'||a.s==='ind') && e.mid && ind[e.mid]!==undefined) ind[e.mid]+=pts;
    if((a.s==='both'||a.s==='group') && grp[e.gid]!==undefined) grp[e.gid]+=pts;
    const st=stats[e.gid];
    if(st){
      if(['pf','pm','pd','prac'].includes(e.act)&&pts>0) st.oficial+=pts;
      if(e.act==='ebd') st.ebd+=e.qty;
      if(e.act==='vis_nc') st.visnc+=e.qty;
      if(pts<0) st.pen+=Math.abs(pts);
    }
    const ms=e.mid?mstats[e.mid]:null;
    if(ms){
      if(['pf','pm','pd'].includes(e.act)) ms.oficialCount+=e.qty;
      if(e.act==='ebd') ms.ebd+=e.qty;
      if(e.act==='vis_crente'||e.act==='vis_nc') ms.vis+=e.qty;
      if(pts<0) ms.pen+=Math.abs(pts);
    }
  }
  const capNotes=[];
  for(const m of S.members){
    const raw=ofertaRaw[m.id]||0, eff=Math.min(raw,CAPS.oferta);
    if(eff>0){ ind[m.id]+=eff; const g=ofertaMemG[m.id]||m.g; if(grp[g]!==undefined) grp[g]+=eff; }
    if(raw>CAPS.oferta) capNotes.push(m.n+': ofertas '+raw+' → limitado a '+CAPS.oferta);
  }
  for(const g of S.groups){
    const u=capUse[g.id];
    const alim=Math.min(u.alim,CAPS.alim), agas=Math.min(u.agas,CAPS.agas);
    grp[g.id]+=alim+agas;
    if(u.alim>CAPS.alim) capNotes.push(g.name+': alimentos '+u.alim+' → teto '+CAPS.alim);
    if(u.agas>CAPS.agas) capNotes.push(g.name+': agasalhos '+u.agas+' → teto '+CAPS.agas);
  }
  return {ind,grp,stats,mstats,capNotes};
}

function tieGroup(aId,bId,R){

  d=B.visnc-A.visnc;     if(d) return {n:d,by:'Visitantes não crentes'};
  d=A.pen-B.pen;         if(d) return {n:d,by:'Menos penalidades'};
  return {n:0,by:'EXTRA'};
}
function tieInd(aId,bId,R){
  let d=R.ind[bId]-R.ind[aId]; if(d) return {n:d,by:null};
  const A=R.mstats[aId],B=R.mstats[bId];

  return {n:0,by:'EXTRA'};
}

const SFX = (()=>{

  /* pluck tipo harpa/sino (fundamental + oitava suave, envelope de corda tocada) */
  function pluck(freq,start,dur,gain){
    const c=ac(); if(!c) return;
    const t0=c.currentTime+start;
    const o=c.createOscillator(), o2=c.createOscillator(), g=c.createGain(), g2=c.createGain();

    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); o2.connect(g2).connect(g); g.connect(c.destination);
    o.start(t0); o2.start(t0); o.stop(t0+dur+.05); o2.stop(t0+dur+.05);

  function pseq(ns,gain){ if(muted) return; unlock(); ns.forEach(n=>pluck(n.f,n.t,n.d,gain)); }
  /* ---- música de fundo estilo game (chiptune em loop: baixo + arpejo) ---- */
  const PROG=[[523.25,659.25,784],[440,523.25,659.25],[349.23,440,523.25],[392,493.88,587.33]]; /* C · Am · F · G */
  const ARP=[0,1,2,1];
  const STEP=0.125; /* 16 avos (~120 BPM) */
  let stepIx=0, nextT=0;
  function mnote(freq,time,dur,type,gain){
    const c=ac(); if(!c||!musicGain) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(.0001,time);
    g.gain.linearRampToValueAtTime(gain,time+.006);
    g.gain.exponentialRampToValueAtTime(.0001,time+dur);
    o.connect(g).connect(musicGain); o.start(time); o.stop(time+dur+.03);

  function playStep(step,time){
    const ci=Math.floor(step/16)%PROG.length, pos=step%16, ch=PROG[ci];

    else if(pos%4===2) mnote(ch[0]/2, time, .12, 'triangle', .26);  /* baixo contratempo */
    if(pos%2===0){ const idx=ARP[(pos/2)%ARP.length]; mnote(ch[idx]*2, time, .13, 'square', .3); } /* arpejo */

    const c=ac();
    if(musicGain&&c){ musicGain.gain.cancelScheduledValues(c.currentTime);
      musicGain.gain.setValueAtTime(musicGain.gain.value,c.currentTime);
      musicGain.gain.linearRampToValueAtTime(.0001,c.currentTime+0.8); }

    /* Seed recebe pontos: brilho ascendente (semente brotando) */
    seed(){ pseq([{f:784,t:0,d:.5},{f:880,t:.08,d:.5},{f:1047,t:.16,d:.75}],.13); },

    coin(){ pseq([{f:880,t:0,d:.35},{f:1319,t:.07,d:.55}],.13); },

/* ===== Animações da aba Grupos — estado persiste FORA do #app (innerHTML) ===== */
let gAnim={shown:{}, w1:null, lastLead:undefined}, gCountRAF={};
function prefersReduced(){ return matchMedia('(prefers-reduced-motion: reduce)').matches; }
function animCount(gid, el, from, to, dur){
  cancelAnimationFrame(gCountRAF[gid]);
  if(from===to){ el.textContent=fmt(to); return; }
  const t0=performance.now();
  const step=t=>{
    const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
    el.textContent=fmt(Math.round(from+(to-from)*e));
    if(p<1) gCountRAF[gid]=requestAnimationFrame(step); else el.textContent=fmt(to);
  };
  gCountRAF[gid]=requestAnimationFrame(step);
}
function spawnLeadFx(card){
  const box=document.createElement('div'); box.className='leadfx';
  for(let i=0;i<10;i++){
    const s=document.createElement('span');
    const ang=(Math.PI*2)*(i/10)+Math.random()*.5, dist=26+Math.random()*22;
    s.style.setProperty('--dx',(Math.cos(ang)*dist).toFixed(1)+'px');
    s.style.setProperty('--dy',(Math.sin(ang)*dist).toFixed(1)+'px');
    s.style.animationDelay=(Math.random()*80|0)+'ms';
    box.appendChild(s);
  }
  card.appendChild(box);
  setTimeout(()=>box.remove(),900);
}
function animateGroups(R, isEntry){
  const RM=prefersReduced();
  const wrap=document.querySelector('.gwrap');
  if(wrap && isEntry && !RM) wrap.classList.add('gEnter');
  /* contagem dos pontos: só do 0 na entrada; senão só anima se o valor mudou */
  let gGain=false;
  document.querySelectorAll('.gpts[data-gid]').forEach(el=>{
    const gid=el.dataset.gid, to=R.grp[gid]||0, prev=gAnim.shown[gid];
    if(!isEntry && prev!==undefined && to>prev) gGain=true;
    if(RM){ el.textContent=fmt(to); gAnim.shown[gid]=to; return; }
    const from=isEntry?0:(prev===undefined?to:prev);
    animCount(gid, el, from, to, 900);
    gAnim.shown[gid]=to;
  });
  if(gGain) SFX.group();
  /* barra de duelo + seam luminoso */
  const duel=document.querySelector('.gwrap .duel'), d1=duel&&duel.querySelector('.d1'), d2=duel&&duel.querySelector('.d2');
  if(d1&&d2){
    const g1=S.groups[0], g2=S.groups[1];
    const target=Math.round((R.grp[g1.id]||0)/(((R.grp[g1.id]||0)+(R.grp[g2.id]||0))||1)*100);
    const setW=v=>{ d1.style.width=v+'%'; d2.style.width=(100-v)+'%'; duel.style.setProperty('--w1',v+'%'); };
    if(RM){ setW(target); gAnim.w1=target; }
    else{
      const start=isEntry?0:(gAnim.w1==null?target:gAnim.w1);
      setW(start);
      requestAnimationFrame(()=>requestAnimationFrame(()=>setW(target)));
      gAnim.w1=target;
    }
  }
  /* partículas quando um grupo ASSUME a liderança (mudança real, não 1ª pintura) */
  const gs=[...S.groups].sort((a,b)=>tieGroup(a.id,b.id,R).n);
  const t01=gs.length>1?tieGroup(gs[0].id,gs[1].id,R):{n:0};
  const leadId=t01.n!==0?gs[0].id:null;
  if(!RM && leadId && gAnim.lastLead!==undefined && gAnim.lastLead!==leadId){
    const card=document.querySelector('.gcard[data-gid="'+leadId+'"]');
    if(card) spawnLeadFx(card);
    SFX.fanfare();
  }
  gAnim.lastLead=leadId;
}

/* ===== Animações da aba Seeds (mesma lógica de estado fora do #app) ===== */
let iAnim={pts:{}, xp:{}};
function animateInd(R, isEntry){
  const RM=prefersReduced();
  const wrap=document.querySelector('.iwrap');
  if(wrap && isEntry && !RM) wrap.classList.add('iEnter');
  /* contagem dos pontos (pódio + linhas). Lê o valor anterior ANTES de atualizar. */
  let iGain=false;
  document.querySelectorAll('[data-ptsmid]').forEach(el=>{
    const mid=el.dataset.ptsmid, to=R.ind[mid]||0, prev=iAnim.pts[mid];
    if(!isEntry && prev!==undefined && to>prev) iGain=true;
    if(RM){ el.textContent=fmt(to); return; }
    const from=isEntry?0:(prev===undefined?to:prev);
    animCount('i'+el.dataset.k, el, from, to, 900);
  });
  S.members.forEach(m=>{ iAnim.pts[m.id]=R.ind[m.id]||0; });
  if(iGain) SFX.seed();
  /* barras de XP */
  document.querySelectorAll('.xp>i[data-xpmid]').forEach(el=>{
    const mid=el.dataset.xpmid, target=parseFloat(el.dataset.pct)||0;
    if(RM){ el.style.width=target+'%'; iAnim.xp[mid]=target; return; }
    const prev=iAnim.xp[mid];
    const start=isEntry?0:(prev===undefined?target:prev);
    el.style.width=start+'%';
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.width=target+'%'; }));
    iAnim.xp[mid]=target;
  });
}

/* ===== Banco de perguntas (só aparece no painel do líder) ===== */
function vQuestions(){
  const used=new Set(S.usedQuestions||[]);
  const total=questionsTotal();
  const totalUsed=QUESTIONS.reduce((s,sec)=>s+((sec.items||[]).filter(it=>used.has(it.id)).length),0);
  let h='<div class="card"><h2>📖 Banco de Perguntas · Parábolas</h2>';
  if(!questionsLoaded){
    h+='<p class="hint">Carregando perguntas do Firebase…</p></div>';
    return h;
  }
  if(!QUESTIONS.length){
    h+='<p class="hint">Nenhuma pergunta publicada ainda. Use <b>➕ Cadastrar pergunta</b> ou <b>⚙️ Publicar banco de perguntas</b>, no card <b>Gerenciar</b>, para enviar o banco ao Firebase (fica protegido — só a liderança lê).</p></div>';
    return h;
  }
  h+='<p class="hint">Só a liderança vê isto (as respostas ficam no Firebase protegido, não no código da página). Leia para os Seeds <b>apenas a pergunta</b> — a resposta fica escondida em "Ver resposta". Marque as que já foram <b>enviadas ou usadas</b>. <b>'+totalUsed+' de '+total+'</b> marcadas.</p>';
  QUESTIONS.forEach((sec,si)=>{
    const items=sec.items||[];
    const uc=items.filter(it=>used.has(it.id)).length;
    h+='<details style="--i:'+si+'"><summary>'+esc(sec.name)+' <span class="qsecmeta">· '+esc(sec.pts)+' · '+uc+'/'+items.length+'</span></summary>';
    items.forEach(it=>{
      const on=used.has(it.id);
      h+='<div class="hrow qrow'+(on?' used':'')+'">'+
        '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start">'+
          '<div class="qq"><b>'+esc(it.c)+'.</b> '+esc(it.q)+(on?'<span class="qbadge">✓ usada</span>':'')+'</div>'+
          '<button class="btn '+(on?'gold':'ghost')+' sm" data-qtoggle="'+it.id+'" style="white-space:nowrap">'+(on?'Desmarcar':'Marcar')+'</button>'+
        '</div>'+
        '<details class="qansd"><summary>Ver resposta</summary>'+
          '<div class="qans">Resposta: '+esc(it.a)+'</div>'+
          '<div class="qref">'+esc(it.r)+'</div>'+
        '</details>'+
      '</div>';
    });
    h+='</details>';
  });
  h+='<button class="btn ghost sm" id="btnQClear" style="margin-top:12px">Desmarcar todas</button>';
  h+='</div>';
  return h;
}
/* Painel de administração do banco: cola o JSON das perguntas e publica no Firebase.

function askConfirm(msg){

    const ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(10,8,5,.72);z-index:200;display:flex;align-items:center;justify-content:center;padding:24px';

      '<div style="display:flex;gap:10px;margin-top:18px">'+
      '<button class="btn ghost" data-cf="0" style="margin-top:0;flex:1">Cancelar</button>'+
      '<button class="btn red" data-cf="1" style="margin-top:0;flex:1">Confirmar</button></div></div>';
    document.body.appendChild(ov);
    const done=v=>{ov.remove();res(v);};
    ov.querySelector('[data-cf="1"]').onclick=()=>done(true);

    ov.onclick=e=>{ if(e.target===ov) done(false); };
  });
}

const gName=id=>{const g=S.groups.find(x=>x.id===id);return g?g.name:'';};
function stamp(){return new Date().toISOString().slice(0,16).replace(/[:T]/g,'-');}

function tryDownload(filename, blob){
  try{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download=filename; a.style.display='none';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    return true;
  }catch(e){ return false; }
}

function buildSheets(){
  const R=calc();
  const indS=[...S.members].sort((a,b)=>tieInd(a.id,b.id,R).n);
  const ind=indS.map((m,i)=>{
    let dz=''; if(i>0 && R.ind[indS[i-1].id]===R.ind[m.id]){ const t=tieInd(indS[i-1].id,m.id,R);
      dz = t.by==='EXTRA'?'Empate — pergunta extra':(t.by?'Atrás por: '+t.by:''); }
    return [i+1, m.n, gName(m.g), R.ind[m.id], dz];
  });
  const grpS=[...S.groups].sort((a,b)=>tieGroup(a.id,b.id,R).n);
  const grp=grpS.map((g,i)=>{
    let dz=''; if(i>0 && R.grp[grpS[i-1].id]===R.grp[g.id]){ const t=tieGroup(grpS[i-1].id,g.id,R);
      dz = t.by==='EXTRA'?'Empate — pergunta extra':(t.by?'Atrás por: '+t.by:''); }
    return [i+1, g.name, R.grp[g.id], S.members.filter(m=>m.g===g.id).length, dz];
  });
  const lanc=[...S.entries].sort((x,y)=>x.ts-y.ts).map(en=>{
    const a=ACT[en.act]; if(!a) return null;
    const who=en.mid?(S.members.find(m=>m.id===en.mid)?.n||''):'';
    const scope=a.s==='both'?'Individual+Grupo':(a.s==='group'?'Grupo':'Individual');
    return [en.d, en.leader||'', a.n, who, gName(en.gid), en.qty, scope, a.v, a.v*en.qty, en.note||''];
  }).filter(Boolean);
  const parts=[...S.members].sort((a,b)=>a.g.localeCompare(b.g)||a.n.localeCompare(b.n))
    .map(m=>[m.n, gName(m.g), R.ind[m.id]]);
  const ats=[]; CATS_ALL.forEach(c=>c.acts.forEach(a=>{
    ats.push([a.n, c.name, a.s==='both'?'Individual+Grupo':(a.s==='group'?'Grupo':'Individual'), a.v, a.unit||'']);}));
  return {
    ind:[['Posição','Participante','Grupo','TOTAL','Desempate'], ...ind],
    grp:[['Posição','Grupo','TOTAL','Seeds','Desempate'], ...grp],
    lanc:[['Data','Líder','Atividade','Participante','Grupo','Qtd','Escopo','Pts base','Pts (base×qtd)','Observação'], ...lanc],
    parts:[['Participante','Grupo','TOTAL'], ...parts],
    ats:[['Atividade','Categoria','Escopo','Pontos','Unidade'], ...ats]
  };
}

function exportXlsx(){
  const S3=buildSheets();
  if(typeof XLSX==='undefined'){ toast('Biblioteca não carregou — exportando CSV'); return exportCsv(); }
  try{
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.ind),   'Ranking Individual');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.grp),   'Ranking Grupos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.lanc),  'Lançamentos');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.parts), 'Participantes');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(S3.ats),   'Atividades');
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    const ok=tryDownload('SeedsBattle_pontos_'+stamp()+'.xlsx', new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    toast(ok?'Excel exportado ✅':'Não foi possível baixar — veja a cópia');
    if(!ok) exportCsv();
  }catch(e){ toast('Erro no Excel — exportando CSV'); exportCsv(); }
}

function exportCsv(){
  const S3=buildSheets();
  const toCsv=rows=>rows.map(r=>r.map(c=>{const s=String(c??'');return /[",;\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(';')).join('\n');
  const txt='RANKING INDIVIDUAL\n'+toCsv(S3.ind)+'\n\nRANKING GRUPOS\n'+toCsv(S3.grp)+'\n\nLANÇAMENTOS\n'+toCsv(S3.lanc);
  const ok=tryDownload('SeedsBattle_pontos_'+stamp()+'.csv', new Blob(['\ufeff'+txt],{type:'text/csv;charset=utf-8'}));
  if(!ok) showCopyBox('Pontos (CSV)', txt);
}

function backupObject(){
  return {
    app:'seeds-battle', edition:'ed1', key:KEY,
    exportedAt:new Date().toISOString(),
    counts:{
      grupos:S.groups.length, participantes:S.members.length,
      lideres:S.leaders.length, atividadesPersonalizadas:(S.customActs||[]).length,
      lancamentos:S.entries.length
    },
    groups:S.groups,
    members:S.members,
    leaders:S.leaders,               /* nome + PIN de cada líder */
    customActs:S.customActs||[],     /* atividades personalizadas */
    usedQuestions:S.usedQuestions||[], /* perguntas já usadas/enviadas */
    entries:S.entries,
    rosterSeeded:S.rosterSeeded||null
  };
}
function exportJson(){
  const txt=JSON.stringify(backupObject(),null,2);
  const ok=tryDownload('SeedsBattle_backup_'+stamp()+'.json', new Blob([txt],{type:'application/json'}));
  toast(ok?'Backup .json baixado ✅ (inclui líderes e atividades)':'Veja a cópia do backup');
  if(!ok) showCopyBox('Backup completo (.json)', txt);
}

async function importJson(text){
  if(!DB) return toast('Configure o Firebase antes de importar');
  let data; try{ data=JSON.parse(text); }catch(e){ return toast('JSON inválido'); }
  if(!data || !Array.isArray(data.members) || !Array.isArray(data.groups) || !Array.isArray(data.entries))
    return toast('Backup não reconhecido');
  const nLead=Array.isArray(data.leaders)?data.leaders.length:0;
  const nAct=Array.isArray(data.customActs)?data.customActs.length:0;
  if(!(await askConfirm('Importar para o Firebase? SUBSTITUI os dados atuais.\n\nVai gravar: '+data.members.length+' participantes, '+nLead+' líderes, '+nAct+' atividades e '+data.entries.length+' lançamentos.'))) return;
  const leaders=(Array.isArray(data.leaders)&&data.leaders.length)
    ? data.leaders.map(l=>({id:l.id||('l'+Math.random().toString(36).slice(2,8)), name:l.name}))
    : [{id:'l1',name:'Coordenação'}];
  const newCfg={ groups:data.groups, members:data.members, leaders,
    customActs:Array.isArray(data.customActs)?data.customActs:[],
    usedQuestions:Array.isArray(data.usedQuestions)?data.usedQuestions:[],
    rosterSeeded:data.rosterSeeded||'ed1-18' };
  const eObj={};
  for(const e of data.entries){
    const k=DB.ref('entries').push().key;
    const {id, ...rest}=e; eObj[k]=rest;
  }
  try{
    await DB.ref('entries').set(eObj);
    await DB.ref('config').set(newCfg);
    toast('Importado ✅ '+leaders.length+' líderes · '+newCfg.customActs.length+' atividades · '+data.entries.length+' lançamentos');
  }catch(err){ toast('Falha ao importar: '+(err.code||err.message)); }
}

async function initDefaults(){
  if(!DB) return toast('Configure o Firebase antes');
  if(!(await askConfirm('Inicializar com os 18 participantes padrão? Isso grava a configuração inicial (não apaga lançamentos existentes).'))) return;
  try{ await DB.ref('config').set(defaultConfig()); toast('Configuração inicial gravada ✅'); }
  catch(e){ toast('Falha: '+(e.code||e.message)); }
}

function updatePrev(){
  const sel=document.getElementById('fAct'); if(!sel)return;
  const a=ACT[sel.value], q=Math.max(1,parseInt(document.getElementById('fQty').value||'1',10));
  const pts=a.v*q;
  const scope=a.s==='both'?'Seed + grupo recebem':(a.s==='group'?'Só o grupo recebe':'Só o Seed recebe');
  document.getElementById('fPrev').textContent=(pts<0?'−':'+')+fmt(Math.abs(pts))+' pts · '+scope+
    (a.cap?' · sujeito a teto':'');
}

function bind(){
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{SFX.tick();view=t.dataset.v;editingId=null;render();});
  const q=id=>document.getElementById(id);
  if(q('btnLogin'))q('btnLogin').onclick=async()=>{
    if(!AUTH) return toast('Firebase não configurado');
    const email=q('lgEmail').value.trim(), pass=q('lgPass').value;
    if(!email||!pass) return toast('Preencha e-mail e senha');
    try{ await AUTH.signInWithEmailAndPassword(email,pass); toast('Bem-vindo(a)!'); SFX.success(); }
    catch(err){ toast('Falha no login: '+(err.code||err.message)); SFX.penalty(); }
  };
  if(q('btnLogout'))q('btnLogout').onclick=async()=>{ editingId=null; try{ await AUTH.signOut(); }catch(e){} };
  if(q('fWho'))q('fWho').onchange=()=>{ logged=q('fWho').value; };
  if(q('fAct')){
    q('fAct').onchange=()=>{const keep=q('fAct').value;render();
      const s=document.getElementById('fAct');if(s){s.value=keep;updatePrev();}};
    q('fQty').oninput=updatePrev; updatePrev();
    if(editingId){const e=S.entries.find(x=>x.id===editingId);
      if(e){q('fAct').value=e.act;
        if(q('fMem')&&e.mid)q('fMem').value=e.mid;
        if(q('fGrp'))q('fGrp').value=e.gid; updatePrev();}}
  }
  if(q('btnSave'))q('btnSave').onclick=async()=>{
    const act=q('fAct').value, a=ACT[act];
    const qty=Math.max(1,parseInt(q('fQty').value||'1',10));
    const d=q('fDate').value||new Date().toISOString().slice(0,10);
    const note=q('fNote').value.trim();
    let mid=null,gid;
    if(a.s!=='group'){mid=q('fMem').value;gid=S.members.find(m=>m.id===mid).g;}
    else gid=q('fGrp').value;
    if(editingId){
      const e=S.entries.find(x=>x.id===editingId);
      const obj={ts:e.ts||Date.now(),act,qty,d,note,mid,gid,leader:(e.leader||'')+' (corr. '+logged+')'};
      const key=editingId; editingId=null; await fbSetEntry(key,obj); toast('Lançamento corrigido ✏️'); SFX.tick();
    }else{
      await fbAddEntry({ts:Date.now(),act,qty,d,note,mid,gid,leader:logged});
      toast((a.v<0?'Penalidade registrada':'+'+fmt(a.v*qty)+' pts lançados! 🌱'));
      a.v<0?SFX.penalty():SFX.coin();
    }
  };
  if(q('btnCancelEdit'))q('btnCancelEdit').onclick=()=>{editingId=null;render();};
  document.querySelectorAll('[data-hist]').forEach(el=>{
    el.onclick=()=>{ SFX.tick(); showMemberHistory(el.dataset.hist); };
    el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); SFX.tick(); showMemberHistory(el.dataset.hist); } };
  });
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editingId=b.dataset.edit;render();window.scrollTo({top:0,behavior:'smooth'});});
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
    if(!(await askConfirm('Excluir este lançamento? Não pode ser desfeito.')))return;
    await fbDelEntry(b.dataset.del); toast('Lançamento excluído');});
  if(q('btnAddLeader'))q('btnAddLeader').onclick=async()=>{
    const n=q('nlName').value.trim();
    if(n.length<2)return toast('Digite o nome do líder');
    if(S.leaders.some(l=>l.name.toLowerCase()===n.toLowerCase()))return toast('Já existe líder com esse nome');
    const c=currentConfig(); c.leaders=[...c.leaders,{id:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n}];
    await fbSaveConfig(c); toast('Líder '+n+' adicionado 🛡️');};
  document.querySelectorAll('[data-delleader]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delleader;
    if(S.leaders.length<=1)return toast('Mantenha ao menos 1 nome de líder');
    const leader=S.leaders.find(l=>l.id===id); if(!leader)return toast('Não encontrado');
    if(!(await askConfirm('Remover o nome "'+leader.name+'" do histórico? (Isso não remove o acesso — faça isso no Firebase Authentication.)')))return;
    if(leader.name===logged) logged=null;
    const c=currentConfig(); c.leaders=c.leaders.filter(l=>l.id!==id);
    await fbSaveConfig(c); toast('Nome removido'); });
  if(q('btnAddMem'))q('btnAddMem').onclick=async()=>{
    const n=q('nmName').value.trim();if(n.length<2)return toast('Digite o nome');
    const c=currentConfig(); c.members=[...c.members,{id:'m'+Date.now().toString(36)+Math.random().toString(36).slice(2,4),n,g:q('nmGrp').value}];
    await fbSaveConfig(c); toast(n+' entrou na batalha! 🌱');};
  document.querySelectorAll('[data-delmem]').forEach(b=>b.onclick=async ev=>{
    ev.preventDefault();
    const m=S.members.find(x=>x.id===b.dataset.delmem);
    if(!(await askConfirm('Remover '+m.n+'? Os lançamentos dele(a) continuam no histórico do grupo.')))return;
    const c=currentConfig(); c.members=c.members.filter(x=>x.id!==m.id);
    await fbSaveConfig(c);});
  if(q('btnRenameG'))q('btnRenameG').onclick=async()=>{
    const c=currentConfig();
    if(c.groups[0])c.groups[0].name=q('rg1').value.trim()||c.groups[0].name;
    if(c.groups[1])c.groups[1].name=q('rg2').value.trim()||c.groups[1].name;
    await fbSaveConfig(c);toast('Grupos atualizados');};
  if(q('btnInit'))q('btnInit').onclick=()=>initDefaults();
  if(q('btnXlsx'))q('btnXlsx').onclick=()=>exportXlsx();
  if(q('btnJson'))q('btnJson').onclick=()=>exportJson();
  if(q('btnRestore'))q('btnRestore').onclick=()=>importJson(q('restoreTxt').value.trim());
  if(q('btnAddAct'))q('btnAddAct').onclick=async()=>{
    const n=q('naName').value.trim(), v=parseInt(q('naVal').value,10), s=q('naScope').value, unit=q('naUnit').value.trim();
    if(n.length<2)return toast('Digite o nome da atividade');
    if(!Number.isFinite(v)||v===0)return toast('Informe os pontos (diferente de 0)');
    const act={id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), n, v, s};
    if(unit)act.unit=unit;
    const c=currentConfig(); c.customActs=[...(c.customActs||[]),act];
    await fbSaveConfig(c); toast('Atividade "'+n+'" cadastrada 🎯');};
  document.querySelectorAll('[data-qtoggle]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.qtoggle;
    const set=new Set(S.usedQuestions||[]);
    const wasOn=set.has(id);
    if(wasOn) set.delete(id); else set.add(id);
    const c=currentConfig(); c.usedQuestions=[...set];
    await fbSaveConfig(c); SFX.tick();
    toast(wasOn?'Pergunta liberada de novo':'Pergunta marcada como usada ✓');});
  if(q('btnQPublish'))q('btnQPublish').onclick=async()=>{
    const raw=(q('qJson')&&q('qJson').value||'').trim();
    if(!raw)return toast('Cole o JSON das perguntas primeiro');
    let arr; try{ arr=JSON.parse(raw); }catch(e){ return toast('JSON inválido: '+e.message); }
    if(!Array.isArray(arr)||!arr.length)return toast('O JSON deve ser um array de seções');
    const bad=arr.some(sec=>!sec||!Array.isArray(sec.items));
    if(bad)return toast('Cada seção precisa ter uma lista "items"');
    const n=arr.reduce((s,sec)=>s+sec.items.length,0);
    if(!(await askConfirm('Publicar '+arr.length+' seção(ões) e '+n+' pergunta(s)? Isso substitui o banco atual no Firebase.')))return;
    await fbPublishQuestions(arr);};
  if(q('btnQAdd'))q('btnQAdd').onclick=async()=>{
    const secId=(q('qfSec')&&q('qfSec').value)||'';
    const cod=(q('qfCod')&&q('qfCod').value||'').trim();
    const perg=(q('qfQ')&&q('qfQ').value||'').trim();
    const resp=(q('qfA')&&q('qfA').value||'').trim();
    const ref=(q('qfR')&&q('qfR').value||'').trim();
    if(!secId)return toast('Escolha a seção');
    if(!perg)return toast('Digite a pergunta');
    if(!resp)return toast('Digite a resposta');
    const bank=JSON.parse(JSON.stringify(Array.isArray(QUESTIONS)?QUESTIONS:[]));
    let sec=bank.find(s=>s&&s.id===secId);
    if(!sec){ const meta=QSECTIONS_META.find(m=>m.id===secId)||{id:secId,name:secId,pts:''}; sec={id:meta.id,name:meta.name,pts:meta.pts,items:[]}; bank.push(sec); }
    if(!Array.isArray(sec.items)) sec.items=[];
    const allIds=new Set(); bank.forEach(s=>(s&&s.items||[]).forEach(it=>it&&it.id&&allIds.add(it.id)));
    let nid; do{ nid='q'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }while(allIds.has(nid));
    const meta=QSECTIONS_META.find(m=>m.id===secId);
    const pref=(meta&&meta.pref)||(secId[0]||'Q').toUpperCase();
    const item={ id:nid, c:cod||(pref+(sec.items.length+1)), q:perg, a:resp, r:ref };
    if(!(await askConfirm('Adicionar a pergunta na seção "'+(sec.name||sec.id)+'" e publicar no Firebase?')))return;
    sec.items.push(item);
    await fbPublishQuestions(bank);};
  if(q('btnQClear'))q('btnQClear').onclick=async()=>{
    if(!(S.usedQuestions&&S.usedQuestions.length))return toast('Nenhuma pergunta marcada');
    if(!(await askConfirm('Desmarcar todas as perguntas usadas? Isso zera o controle para todos os líderes.')))return;
    const c=currentConfig(); c.usedQuestions=[];
    await fbSaveConfig(c); toast('Marcações limpas');};
  document.querySelectorAll('[data-delact]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.delact, used=S.entries.filter(e=>e.act===id).length;
    const msg=used?('Essa atividade tem '+used+' lançamento(s). Se remover, esses pontos deixam de contar. Remover mesmo assim?'):'Remover esta atividade personalizada?';
    if(!(await askConfirm(msg)))return;
    const c=currentConfig(); c.customActs=(c.customActs||[]).filter(a=>a.id!==id);
    await fbSaveConfig(c); toast('Atividade removida');});
}
buildFx();
initMute();
initMusic();
load();
</script>
